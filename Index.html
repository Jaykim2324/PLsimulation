<!DOCTYPE html>
<html lang="en">
<head>

<title>HUMAX UK — Revenue & Scenario Console</title>

<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect } = React;

// ============================================================
//  HUK 3-Year P&L Simulator
//  EV (category-level) + STB (FHR-6000T) + BT maintenance
//  Adjustable revenue scenarios & cost-reduction levers
// ============================================================

// ---- Central configuration (editable in Settings; referenced by all pages) ----
// Mutable in-memory store. Settings page updates these; pages re-read on each render.
const CONFIG = {
  price: {
    ev_socket: 332.14,
    ev_5m: 342.37,
    ev_75m: 357.73,
    ev_22kw: 579.0,
    stb_fhr: 153.0,
  },
  // EV home blended mix weights (must sum to 1)
  mix: { socket: 0.5, c5m: 0.25, c75m: 0.25 },
  gm: { ev: 0.2, stb: 0.2, bt: 1.0 }, // gross margins
  fx: 1810.195, // KRW per GBP
};
// Back-compat references used throughout the app:
const PRICE = CONFIG.price;          // object ref — mutating properties is reflected everywhere
const GM = CONFIG.gm;                // object ref
const getFX = () => CONFIG.fx;       // FX can change, so read via function
const evBlended = () =>
  CONFIG.mix.socket * PRICE.ev_socket + CONFIG.mix.c5m * PRICE.ev_5m + CONFIG.mix.c75m * PRICE.ev_75m;
const prodPrice = (key) => (key === "MX22" ? PRICE.ev_22kw : evBlended());

// ---- EV categories: 2026 BP annual target (from Monthly Tracking) ----
// baseUnits = 2026 plan; we scale per scenario & per year
const EV_CATEGORIES = [
  { key: "wholesaler", label: "Wholesaler", base: 4220, note: "Yesss·CEF wholesale channel" },
  { key: "distributor", label: "Distributor", base: 600, note: "Stearn and mid-tier distribution" },
  { key: "ecommerce", label: "eCommerce", base: 272, note: "Argos·Online" },
  { key: "dealer", label: "Dealer", base: 1400, note: "BYD and dealerships" },
  { key: "fleet", label: "Fleet", base: 1500, note: "B2B Home/Commercial Fleet" },
  { key: "cpo", label: "CPO", base: 805, note: "Commercial B2B / CPO" },
];

// scenario multipliers vs BP target (Worst/Base/Best), per year
// 2026 anchored to realistic run-rate (Worst ≈ current pace), grows in 27/28
const SCENARIO_MULT = {
  worst: { 2026: 0.08, 2027: 0.16, 2028: 0.24 },
  base: { 2026: 0.14, 2027: 0.25, 2028: 0.40 },
  best: { 2026: 0.24, 2027: 0.40, 2028: 0.62 },
};

// STB FHR-6000T units by scenario (2026 BP = 20,280). Declines after.
const STB_UNITS = {
  worst: { 2026: 14196, 2027: 9000, 2028: 4500 },
  base: { 2026: 17238, 2027: 12000, 2028: 7000 },
  best: { 2026: 20280, 2027: 16000, 2028: 11000 },
};

// BT maintenance: £700k through 2027, removed 2028
const BT_REV = { 2026: 700000, 2027: 700000, 2028: 0 };

// Base fixed-cost budget (Jeff PL) & 2026 actual budget
const BASE_FIXED = 2154193;

const YEARS = [2026, 2027, 2028];
const SCEN = [
  { key: "worst", label: "Worst", color: "#d64545" },
  { key: "base", label: "Base", color: "#00B1A1" },
  { key: "best", label: "Best", color: "#163E35" },
];

const fmtGBP = (n) =>
  (n < 0 ? "−£" : "£") + Math.abs(Math.round(n)).toLocaleString();
const fmtM = (n) => (n < 0 ? "−£" : "£") + (Math.abs(n) / 1e6).toFixed(2) + "M";
const fmtKRW = (n) =>
  (n < 0 ? "−₩" : "₩") + Math.abs(Math.round(n * getFX())).toLocaleString();
const r0k = (n) => Math.round(n).toLocaleString();

// ============================================================
//  FCST SLOTS MODEL — 9 slots (Case × Year), each holding the raw channel-based
//  FCST inputs {rr, pipe, nid, stb}. Savings is YEAR-level (shared, lives in Simulator).
//  Slot → 6 EV-category units conversion mirrors the old channel mapping.
// ============================================================
const FCST_SLOTS_KEY = "huk_fcst_slots";
const EV_CAT_KEYS = ["wholesaler", "distributor", "ecommerce", "dealer", "fleet", "cpo"];

const SEG_MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const SEG_BASE = [
  { key: "wholesaler", label: "Wholesaler (Yesss / CEF)", ytd: 87, runRate: 20, product: "MX7", color: "#001C3D" },
  { key: "distributor", label: "Distributor (Stearn / Argos / Kelvelec)", ytd: 77, runRate: 17, product: "MX7", color: "#00B1A1" },
  { key: "dealer_base", label: "Dealer (BYD)", ytd: 31, runRate: 15, product: "MX7", color: "#3a6ea5" },
  { key: "b2b_base", label: "Installer (ChargedEV)", ytd: 56, runRate: 8, product: "MX7", color: "#5fa8a0" },
  { key: "ecom", label: "eCommerce", ytd: 18, runRate: 4, product: "MX7", color: "#9bb0c2" },
];
const PIPELINE_TYPES = ["Wholesaler", "Distributor", "Installer", "Dealer", "Fleet Manager", "Rental / Leasing", "MDU / Housing", "CPO", "Other B2B"];

// A fresh default FCST input set (channel run-rates + starter pipeline + STB by scenario)
function defaultFcstInputs(caseKey, year) {
  // 2027/2028 default to GROWTH mode (% over 2026), 2026 stays channel-based.
  const defaultGrowth = { worst: { 2027: 30, 2028: 60 }, base: { 2027: 50, 2028: 90 }, best: { 2027: 70, 2028: 130 } };
  return {
    mode: year === 2026 ? "channel" : "growth",
    growthPct: (defaultGrowth[caseKey] && defaultGrowth[caseKey][year]) || 0,  // % growth over 2026 EV units
    rr: Object.fromEntries(SEG_BASE.map((s) => [s.key, s.runRate])),
    pipe: [
      { id: 1, name: "BYD (additional dealers)", type: "Dealer", monthly: 20, startMonth: 7, product: "MX7" },
      { id: 2, name: "Fleet pilot", type: "Fleet Manager", monthly: 10, startMonth: 8, product: "MX7" },
      { id: 3, name: "MDU project", type: "MDU / Housing", monthly: 15, startMonth: 9, product: "MX22" },
    ],
    nid: 4,
    stb: STB_UNITS[caseKey][year],
  };
}

// ---- Cloud store (Google Apps Script web app) — shared across users ----
// Save writes locally (instant) then syncs to the cloud; on load we pull the cloud copy.
const FCST_CLOUD_URL = "https://script.google.com/macros/s/AKfycbyRcYj5UsQewsWIEgyUkDYKAVfndOStDUz3hLx-PjBC9TjiB5_2r9XmnnqcwmXTTkaU5Q/exec";
let SLOTS_CACHE = null;   // in-memory copy (kept in sync with localStorage + cloud)
let CLOUD_STATUS = "";    // shown in FCST action bar

function readLocalSlots() {
  try { const raw = window.localStorage.getItem(FCST_SLOTS_KEY); return raw ? JSON.parse(raw) : {}; } catch (e) { return {}; }
}
function writeLocalSlots(slots) {
  try { window.localStorage.setItem(FCST_SLOTS_KEY, JSON.stringify(slots)); } catch (e) {}
}

function loadFcstSlots() {
  if (SLOTS_CACHE) return SLOTS_CACHE;
  SLOTS_CACHE = readLocalSlots();
  return SLOTS_CACHE;
}
function getSlot(slots, caseKey, year) {
  return (slots && slots[caseKey] && slots[caseKey][year]) || null;
}
function saveSlot(caseKey, year, inputs) {
  const slots = loadFcstSlots();
  if (!slots[caseKey]) slots[caseKey] = {};
  slots[caseKey][year] = inputs;
  SLOTS_CACHE = slots;
  writeLocalSlots(slots);     // instant local persistence
  cloudSave(slots);           // background sync to shared store
  return true;
}

// Pull the shared copy from the cloud and merge it in. onDone(changed) fires after.
function cloudLoad(onDone) {
  if (!FCST_CLOUD_URL) { onDone && onDone(false); return; }
  CLOUD_STATUS = "Syncing…";
  fetch(FCST_CLOUD_URL, { method: "GET" })
    .then((r) => r.json())
    .then((j) => {
      if (j && j.ok && j.data) {
        const cloud = typeof j.data === "string" ? JSON.parse(j.data) : j.data;
        if (cloud && typeof cloud === "object") {
          SLOTS_CACHE = cloud;
          writeLocalSlots(cloud);
          CLOUD_STATUS = "Synced from shared store · " + new Date().toLocaleTimeString();
          onDone && onDone(true);
          return;
        }
      }
      CLOUD_STATUS = "Shared store empty — using local data";
      onDone && onDone(false);
    })
    .catch(() => { CLOUD_STATUS = "Offline — using local data"; onDone && onDone(false); });
}
// Push the full slot set to the cloud. text/plain avoids a CORS preflight.
function cloudSave(slots) {
  if (!FCST_CLOUD_URL) return;
  CLOUD_STATUS = "Saving to shared store…";
  fetch(FCST_CLOUD_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(slots) })
    .then((r) => r.json())
    .then((j) => { CLOUD_STATUS = (j && j.saved) ? "Saved to shared store · " + new Date().toLocaleTimeString() : "Saved locally (cloud unconfirmed)"; })
    .catch(() => { CLOUD_STATUS = "Saved locally (cloud offline)"; });
}

// 2026 EV-category base for a given case (saved 2026 slot if present, else BP × mult).
// Used as the anchor that growth-mode 2027/2028 slots scale from.
function base2026CatBase(slots, caseKey) {
  const slot2026 = getSlot(slots, caseKey, 2026);
  if (slot2026 && slot2026.mode !== "growth") return slotToCatBase(slot2026, slots, caseKey);
  // fall back to BP × scenario multiplier for 2026
  const mult = SCENARIO_MULT[caseKey][2026];
  const ev = {};
  EV_CATEGORIES.forEach((c) => { ev[c.key] = Math.round(c.base * mult); });
  return ev;
}

// Convert one slot's raw inputs → 6 EV-category full-year units.
// channel mode: run-rates + pipeline (mirrors old segmentToCatBase).
// growth mode: 2026 base (same case) × (1 + growthPct/100).
function slotToCatBase(inp, slots, caseKey) {
  if (!inp) return null;
  if (inp.mode === "growth") {
    const b = base2026CatBase(slots, caseKey);
    const f = 1 + (inp.growthPct || 0) / 100;
    const out = {};
    Object.keys(b).forEach((k) => { out[k] = Math.round((b[k] || 0) * f); });
    return out;
  }
  const rr = inp.rr || {};
  const pipe = inp.pipe || [];
  const cats = { wholesaler: 0, distributor: 0, ecommerce: 0, dealer: 0, fleet: 0, cpo: 0 };
  const baseMap = {}; SEG_BASE.forEach((s) => (baseMap[s.key] = s));
  const fullYear = (key) => {
    const s = baseMap[key]; if (!s) return 0;
    const h2 = (rr[key] != null ? rr[key] : s.runRate) * 6;
    return s.ytd + h2;
  };
  cats.wholesaler += fullYear("wholesaler");
  cats.distributor += fullYear("distributor");
  cats.ecommerce += fullYear("ecom");
  cats.dealer += fullYear("dealer_base");
  cats.fleet += fullYear("b2b_base");
  pipe.forEach((c) => {
    const months = Math.max(0, 12 - (c.startMonth - 1));
    const u = (c.monthly || 0) * months;
    switch (c.type) {
      case "Wholesaler": cats.wholesaler += u; break;
      case "Distributor": cats.distributor += u; break;
      case "Dealer": cats.dealer += u; break;
      case "eCommerce": cats.ecommerce += u; break;
      case "Fleet Manager":
      case "Rental / Leasing":
      case "Other B2B": cats.fleet += u; break;
      case "MDU / Housing":
      case "CPO":
      case "Installer": cats.cpo += u; break;
      default: cats.fleet += u;
    }
  });
  return cats;
}

// EV-category base for a Simulator cell: use the saved slot if present, else BP × scenario multiplier.
function cellEVBase(slots, caseKey, year) {
  const slot = getSlot(slots, caseKey, year);
  if (slot) return slotToCatBase(slot, slots, caseKey);
  const mult = SCENARIO_MULT[caseKey][year];
  const ev = {};
  EV_CATEGORIES.forEach((c) => { ev[c.key] = Math.round(c.base * mult); });
  return ev;
}
// STB for a cell: saved slot's stb if present, else scenario default.
function cellSTB(slots, caseKey, year) {
  const slot = getSlot(slots, caseKey, year);
  return (slot && typeof slot.stb === "number") ? slot.stb : STB_UNITS[caseKey][year];
}



function Simulator() {
  const [scenario, setScenario] = useState("base");
  const [year, setYear] = useState(2026);
  // Cost reduction (savings) is COMMON — year-level, shared across cases. Lives here.
  const [savings, setSavings] = useState({ 2026: 0, 2027: 687000, 2028: 687000 });
  const [btKeep2028, setBtKeep2028] = useState(false);

  // FCST slots saved by the FCST Simulation tab (read here). Each cell links to its own slot.
  const slots = loadFcstSlots();

  // ---- compute one cell (case × year): EV+STB from the slot (or default), cost common ----
  const compute = (sc, yr) => {
    const evBase = cellEVBase(slots, sc, yr); // {wholesaler, distributor, ...}
    let evUnits = 0;
    const catBreak = EV_CATEGORIES.map((c) => {
      const u = evBase[c.key] || 0;
      evUnits += u;
      return { ...c, units: u, rev: u * evBlended() };
    });
    const evRev = evUnits * evBlended();
    const stbU = cellSTB(slots, sc, yr);
    const stbRev = stbU * PRICE.stb_fhr;
    let btRev = BT_REV[yr];
    if (yr === 2028 && btKeep2028) btRev = 700000;
    const gp = evRev * GM.ev + stbRev * GM.stb + btRev * GM.bt;
    const totRev = evRev + stbRev + btRev;
    const fixed = BASE_FIXED - (savings[yr] || 0);
    const net = gp - fixed;
    const linked = !!getSlot(slots, sc, yr);
    return { evUnits, evRev, catBreak, stbU, stbRev, btRev, gp, totRev, fixed, net, linked };
  };

  const cur = useMemo(() => compute(scenario, year), [scenario, year, savings, btKeep2028]);
  const gridData = useMemo(() => {
    const g = {};
    SCEN.forEach((s) => { g[s.key] = YEARS.map((y) => compute(s.key, y)); });
    return g;
  }, [savings, btKeep2028]);

  // ---- Excel export — every cell uses its own slot value (or default) ----
  const exportExcel = async () => {
    const r0 = (n) => Math.round(n);
    const hasStyle = typeof window !== "undefined" && window.ExcelJS;

    const sumRows = [
      ["HUK 3-Year P&L Simulation — Export"],
      ["Each Case × Year uses its own saved FCST forecast (EV channels + STB). Cost reduction is shared per year."],
      [],
      ["Net P/L (GBP)", ...YEARS],
      ...SCEN.map((s) => [s.label, ...gridData[s.key].map((d) => r0(d.net))]),
      [],
      ["Net P/L (KRW)", ...YEARS],
      ...SCEN.map((s) => [s.label, ...gridData[s.key].map((d) => r0(d.net * getFX()))]),
      [],
      ["Total Revenue (GBP)", ...YEARS],
      ...SCEN.map((s) => [s.label, ...gridData[s.key].map((d) => r0(d.totRev))]),
      [],
      ["Gross Profit (GBP)", ...YEARS],
      ...SCEN.map((s) => [s.label, ...gridData[s.key].map((d) => r0(d.gp))]),
      [],
      ["Fixed Cost (GBP)", ...YEARS],
      ...SCEN.map((s) => [s.label, ...gridData[s.key].map((d) => r0(d.fixed))]),
    ];

    const scenarioSheets = SCEN.map((s) => {
      const data = YEARS.map((y) => compute(s.key, y));
      const rows = [
        [`${s.label} Scenario — 3-Year Detail`],
        [],
        ["Revenue (GBP)", ...YEARS],
        ["BT Operator", ...data.map((d) => r0(d.btRev))],
        ["STB (FHR-6000T)", ...data.map((d) => r0(d.stbRev))],
        ["EV Sales", ...data.map((d) => r0(d.evRev))],
        ["Total Revenue", ...data.map((d) => r0(d.totRev))],
        [],
        ["Gross Profit (GBP)", ...YEARS],
        ["BT (100%)", ...data.map((d) => r0(d.btRev * GM.bt))],
        ["STB (20%)", ...data.map((d) => r0(d.stbRev * GM.stb))],
        ["EV (20%)", ...data.map((d) => r0(d.evRev * GM.ev))],
        ["Total GP", ...data.map((d) => r0(d.gp))],
        [],
        ["Fixed Cost", ...data.map((d) => r0(d.fixed))],
        ["NET P/L (GBP)", ...data.map((d) => r0(d.net))],
        ["NET P/L (KRW)", ...data.map((d) => r0(d.net * getFX()))],
        [],
        ["Units", ...YEARS],
        ["STB units", ...data.map((d) => r0(d.stbU))],
        ["EV units (total)", ...data.map((d) => r0(d.evUnits))],
        ["FCST source", ...data.map((d) => (d.linked ? "Saved slot" : "Default (BP×mult)"))],
        [],
        ["EV units by category", ...YEARS],
        ...EV_CATEGORIES.map((c, i) => [c.label, ...data.map((d) => r0(d.catBreak[i].units))]),
        [],
        ["EV revenue by category (GBP)", ...YEARS],
        ...EV_CATEGORIES.map((c, i) => [c.label, ...data.map((d) => r0(d.catBreak[i].rev))]),
      ];
      return { label: s.label, rows };
    });

    const aRows = [
      ["Assumptions & Settings"],
      [],
      ["Pricing (GBP)", ""],
      ["EV Socket", PRICE.ev_socket],
      ["EV 5M", PRICE.ev_5m],
      ["EV 7.5M", PRICE.ev_75m],
      ["EV 22kW (MX Pro)", PRICE.ev_22kw],
      ["EV blended (50/25/25)", +evBlended().toFixed(2)],
      ["STB FHR-6000T", PRICE.stb_fhr],
      [],
      ["Gross Margin", ""],
      ["EV / STB / BT", `${GM.ev * 100}% / ${GM.stb * 100}% / ${GM.bt * 100}%`],
      ["FX (KRW/GBP)", getFX()],
      ["Base Fixed Cost", BASE_FIXED],
      [],
      ["Cost reduction applied (GBP) — shared across cases", ""],
      ...YEARS.map((y) => [`${y} savings`, savings[y]]),
      ["BT kept in 2028", btKeep2028 ? "Yes" : "No"],
      [],
      ["EV/STB units by Case × Year (from FCST slots)", ""],
      ["", ...YEARS],
      ...SCEN.flatMap((s) => [
        [s.label + " — EV total", ...YEARS.map((y) => r0(compute(s.key, y).evUnits))],
        [s.label + " — STB", ...YEARS.map((y) => cellSTB(slots, s.key, y))],
      ]),
    ];

    if (!hasStyle) {
      const wb = XLSX.utils.book_new();
      const w1 = XLSX.utils.aoa_to_sheet(sumRows); w1["!cols"] = [{ wch: 24 }, { wch: 14 }, { wch: 14 }, { wch: 14 }];
      XLSX.utils.book_append_sheet(wb, w1, "Summary");
      scenarioSheets.forEach((sh) => { const w = XLSX.utils.aoa_to_sheet(sh.rows); w["!cols"] = [{ wch: 26 }, { wch: 14 }, { wch: 14 }, { wch: 14 }]; XLSX.utils.book_append_sheet(wb, w, sh.label); });
      const w5 = XLSX.utils.aoa_to_sheet(aRows); w5["!cols"] = [{ wch: 42 }, { wch: 16 }, { wch: 14 }, { wch: 14 }];
      XLSX.utils.book_append_sheet(wb, w5, "Assumptions");
      XLSX.writeFile(wb, "HUK_3Year_PL_Simulation.xlsx");
      return;
    }

    const INDIGO = "FF001C3D", AZURE = "FF00B1A1", FOREST = "FF163E35", LIGHT = "FFF7FAFB", LINE = "FFDDE3EA", REDc = "FFD64545";
    const wb = new window.ExcelJS.Workbook();
    wb.creator = "HUMAX UK";
    const border = { top: { style: "thin", color: { argb: LINE } }, left: { style: "thin", color: { argb: LINE } }, bottom: { style: "thin", color: { argb: LINE } }, right: { style: "thin", color: { argb: LINE } } };
    const buildSheet = (name, rows, opts) => {
      const ws = wb.addWorksheet(name, { views: [{ state: "frozen", ySplit: 1 }] });
      const colCount = Math.max(...rows.map((r) => r.length));
      ws.columns = Array.from({ length: colCount }, (_, i) => ({ width: i === 0 ? (opts && opts.firstWidth || 30) : 15 }));
      rows.forEach((r, ri) => {
        const row = ws.addRow(r);
        row.eachCell((cell, ci) => {
          cell.border = border;
          if (ri === 0) {
            cell.font = { name: "Poppins", bold: true, size: 13, color: { argb: "FFFFFFFF" } };
            cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: INDIGO } };
            cell.alignment = { vertical: "middle" };
          } else if (r.length === 1) {
            cell.font = { name: "Poppins", bold: true, size: 11, color: { argb: "FFFFFFFF" } };
            cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: FOREST } };
          } else {
            const labelCell = ci === 1;
            const isNet = typeof r[0] === "string" && r[0].toUpperCase().includes("NET P/L");
            const isScenRow = SCEN.some((s) => s.label === r[0]);
            cell.font = { name: "Poppins", size: 10.5, bold: labelCell || isNet };
            if (ci > 1 && typeof cell.value === "number") {
              cell.numFmt = "#,##0";
              cell.alignment = { horizontal: "right" };
              if (isNet || isScenRow) cell.font = { name: "Poppins", size: 10.5, bold: true, color: { argb: cell.value >= 0 ? AZURE : REDc } };
            }
            if (labelCell && ri % 2 === 0) cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: LIGHT } };
            if (YEARS.includes(cell.value)) { cell.font = { name: "Poppins", bold: true, size: 10.5, color: { argb: "FFFFFFFF" } }; cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: AZURE } }; cell.alignment = { horizontal: "right" }; }
          }
        });
      });
      ws.mergeCells(1, 1, 1, colCount);
      ws.getRow(1).height = 24;
    };
    buildSheet("Summary", sumRows, { firstWidth: 24 });
    scenarioSheets.forEach((sh) => buildSheet(sh.label, sh.rows, { firstWidth: 26 }));
    buildSheet("Assumptions", aRows, { firstWidth: 42 });
    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "HUK_3Year_PL_Simulation.xlsx"; a.click();
    URL.revokeObjectURL(url);
  };

  const anySlot = SCEN.some((s) => YEARS.some((y) => getSlot(slots, s.key, y)));

  return (
    <>
      <header style={S.header}>

// Parse the published "Monthly Tracking" CSV into dashboard data.
// Robust to the sheet's layout: category Target/Actual rows + Grand Total + branch detail.
function parseMonthlyCSV(text) {
  // simple CSV row splitter handling quoted commas
  const rows = text.split(/\r?\n/).map((line) => {
    const out = []; let cur = ""; let q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') q = !q;
      else if (ch === "," && !q) { out.push(cur); cur = ""; }
      else cur += ch;
    }
    out.push(cur);
    return out.map((s) => s.trim());
  });
  const num = (v) => { const n = parseFloat(String(v).replace(/[, ]/g, "")); return isNaN(n) ? 0 : n; };

  // EV blended price & STB price come from CONFIG
  const evP = evBlended();

  // --- category section: EV Home / EV Commercial rows with Target/Actual per segment ---
  // Track which EV segment block we're in, and which segment label each Target/Actual pair belongs to.
  // Group into: Retail (Simon+Mudassar+Midland+North), B2B (B2B Home/Commercial), eCommerce — split Home vs Commercial.
  const grp = {
    retail_home: { actual: 0, target: 0 },
    retail_comm: { actual: 0, target: 0 },
    b2b_home: { actual: 0, target: 0 },
    b2b_comm: { actual: 0, target: 0 },
    ecom: { actual: 0, target: 0 },
  };
  let evSeg = ""; // "home" | "commercial"
  let curLabel = "";
  const classify = (label, seg) => {
    const l = label.toLowerCase();
    if (l.includes("ecommerce") || l.includes("e-commerce")) return "ecom";
    if (l.includes("b2b")) return seg === "commercial" ? "b2b_comm" : "b2b_home";
    // retail = Simon, Mudassar, Midland, North, Retailer/Wholesaler
    return seg === "commercial" ? "retail_comm" : "retail_home";
  };
  rows.forEach((r) => {
    const c0 = (r[0] || "").trim().toLowerCase();
    if (c0.includes("ev home")) evSeg = "home";
    else if (c0.includes("ev commercial")) evSeg = "commercial";
    else if (c0.includes("grand total")) evSeg = "";
    // category label sits in col1 on the Target row; col2 = Target/Actual/Ach %
    const tag = (r[2] || "").toLowerCase();
    const labelCell = (r[1] || "").trim();
    if (labelCell) curLabel = labelCell;
    if (!evSeg || !curLabel) return;
    if (tag === "target" || tag === "actual") {
      const monthly = r.slice(3, 15).map(num);
      const tot = monthly.reduce((a, b) => a + b, 0);
      const bucket = classify(curLabel, evSeg);
      if (grp[bucket]) grp[bucket][tag === "target" ? "target" : "actual"] += tot;
    }
  });
  const hasGrouped = Object.values(grp).some((g) => g.target > 0 || g.actual > 0);

  // legacy branch-detail consolidation (kept for evMonthlyActual / evUnits / fallback) ---
  const catActual = {};
  let grandActualMonthly = new Array(12).fill(0);
  rows.forEach((r) => {
    const tag = (r[2] || "").toLowerCase();
    const label = r[1] || "";
    if (tag === "actual" && label && r.length >= 15) {
      const monthly = r.slice(3, 15).map(num);
      const tot = monthly.reduce((a, b) => a + b, 0);
      if (label) catActual[label] = (catActual[label] || 0) + tot;
    }
    if ((r[0] || "").toLowerCase() === "grand total" && tag === "actual") {
      grandActualMonthly = r.slice(3, 15).map(num);
    }
  });

  const evMonthlyActual = grandActualMonthly.map((v) => (v > 0 ? v : null));
  const evUnits = grandActualMonthly.reduce((a, b) => a + b, 0);

  const groupedCats = [
    { label: "Retail · EV Home", actual: grp.retail_home.actual, target: grp.retail_home.target },
    { label: "Retail · EV Commercial", actual: grp.retail_comm.actual, target: grp.retail_comm.target },
    { label: "B2B · EV Home", actual: grp.b2b_home.actual, target: grp.b2b_home.target },
    { label: "B2B · EV Commercial", actual: grp.b2b_comm.actual, target: grp.b2b_comm.target },
    { label: "eCommerce", actual: grp.ecom.actual, target: grp.ecom.target },
  ];

  return {
    evMonthlyActual,
    evUnits,
    evRev: evUnits * evP,
    categories: hasGrouped ? groupedCats : null,
  };
}

// ============================================================
//  PO ORDER-MASTER PARSER (Simon / Mudassar / B2B Sales tabs)
//  Parses Confirmed PO rows → Wholesaler → Branch → month/week qty & revenue
// ============================================================
const PO_SKU_PRICE = { socket: 369, c5m: 379, c75m: 396, mx22: 579 };
const PO_MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

function splitCSVLine(line) {
  const out = []; let cur = ""; let q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') q = !q;
    else if (ch === "," && !q) { out.push(cur); cur = ""; }
    else cur += ch;
  }
  out.push(cur);
  return out.map((s) => s.trim());
}

// Parse all order-master sections from the full published CSV text.
// Auto-detects each section by its header row, handles Simon/Mudassar (19-col) and B2B (17-col) layouts.
function parsePOOrders(text) {
  const numv = (v) => { const n = parseFloat(String(v).replace(/[, ]/g, "")); return isNaN(n) ? 0 : n; };
  const lines = text.split(/\r?\n/);
  const rows = lines.map(splitCSVLine);

  const recs = [];
  let layout = null; // current column layout

  rows.forEach((r) => {
    const c0 = (r[0] || "").trim();
    // detect header rows
    if (c0 === "Status" && r.includes("Model")) {
      const wholeIdx = r.findIndex((x) => /Wholesaler|Dist/i.test(x));
      const custIdx = r.findIndex((x) => /Customer/i.test(x));
      const branchIdx = r.findIndex((x) => /Branch/i.test(x));
      const monthIdx = r.findIndex((x) => /Target Month/i.test(x));
      const weekIdx = r.findIndex((x) => /Week/i.test(x));
      const mx22Idx = r.findIndex((x) => /^MX22$/i.test(x));
      const eqp7Idx = r.findIndex((x) => /EQ Pro 7/i.test(x));
      const eqp22Idx = r.findIndex((x) => /EQ Pro 22/i.test(x));
      layout = {
        model: 1, socket: 2, c5m: 3, c75m: 4,
        eqp7: eqp7Idx >= 0 ? eqp7Idx : 5,
        eqp22: eqp22Idx >= 0 ? eqp22Idx : 6,
        mx22: mx22Idx >= 0 ? mx22Idx : 7,
        branch: branchIdx >= 0 ? branchIdx : 12,
        whole: wholeIdx >= 0 ? wholeIdx : (custIdx >= 0 ? custIdx : 13),
        month: monthIdx >= 0 ? monthIdx : 15,
        week: weekIdx >= 0 ? weekIdx : 16,
        custIdx,
      };
      return;
    }
    if (!layout) return;
    if (c0 !== "Confirmed PO") return;

    const model = (r[layout.model] || "").trim().toUpperCase();
    const socket = numv(r[layout.socket]), c5 = numv(r[layout.c5m]), c75 = numv(r[layout.c75m]), mx22 = numv(r[layout.mx22]);
    const eqp7 = numv(r[layout.eqp7]), eqp22 = numv(r[layout.eqp22]);
    const qty = socket + c5 + c75 + mx22 + eqp7 + eqp22;
    // Skip only rows with no SKU data at all. Keep negative qty (returns/credits) so totals reconcile with the sales report.
    if (qty === 0 && socket === 0 && c5 === 0 && c75 === 0 && mx22 === 0 && eqp7 === 0 && eqp22 === 0) return;

    // SKU-level product mix attribution by Model + cable column
    // MX7 → Socket / 5M / 7.5M ; EQ7 → EQ7 4M(socket col) / EQ7 7M(5m+7.5m) ; EQ Pro/MX22 → commercial
    const isEQ7 = model.startsWith("EQ7");
    const isEQPro = model.includes("EQ PRO") || model.includes("MX PRO") || model === "22KW";
    const sku = {
      mx7_socket: 0, mx7_5m: 0, mx7_75m: 0,
      eq7_4m: 0, eq7_7m: 0, eqpro: 0,
    };
    if (isEQ7) {
      // EQ7 uses the cable columns: treat socket col → 4M, 5m+7.5m → 7M
      sku.eq7_4m += socket;
      sku.eq7_7m += c5 + c75;
    } else if (isEQPro) {
      sku.eqpro += socket + c5 + c75 + eqp7 + eqp22 + mx22;
    } else {
      // MX7 (residential cable lengths)
      sku.mx7_socket += socket;
      sku.mx7_5m += c5;
      sku.mx7_75m += c75;
      sku.eqpro += eqp7 + eqp22 + mx22; // any commercial SKU on an MX7 row
    }

    let whole = (r[layout.whole] || "").trim();
    let branch = (r[layout.branch] || "").trim();
    if (!whole) whole = branch || "Other";
    if (!branch) branch = whole;

    const month = (r[layout.month] || "").trim();
    const week = numv(r[layout.week]);
    const rev = socket * PO_SKU_PRICE.socket + c5 * PO_SKU_PRICE.c5m + c75 * PO_SKU_PRICE.c75m + (mx22 + eqp22) * PO_SKU_PRICE.mx22 + eqp7 * PO_SKU_PRICE.c75m;
    recs.push({ whole, branch, month, week, socket, c5, c75, mx22, qty, rev, sku });
  });
  return recs;
}

// Aggregate Confirmed-PO records into the 6 Product-Mix buckets
function poProductMix(recs) {
  const t = { mx7_socket: 0, mx7_5m: 0, mx7_75m: 0, eq7_4m: 0, eq7_7m: 0, eqpro: 0 };
  recs.forEach((r) => { if (r.sku) Object.keys(t).forEach((k) => (t[k] += r.sku[k] || 0)); });
  return [
    { label: "MX7 Socket", units: t.mx7_socket },
    { label: "MX7 5M", units: t.mx7_5m },
    { label: "MX7 7.5M", units: t.mx7_75m },
    { label: "EQ7 4M", units: t.eq7_4m },
    { label: "EQ7 7M", units: t.eq7_7m },
    { label: "EQ Pro / MX Pro", units: t.eqpro },
  ];
}

// Aggregate records into Wholesaler → Branch → per-month/week structure
function aggregatePO(recs, mode /* 'month' | 'week' */) {
  const cols = mode === "week"
    ? Array.from({ length: 53 }, (_, i) => i + 1)   // WK1..53
    : PO_MONTHS;
  const keyOf = (rec) => mode === "week" ? rec.week : rec.month;

  const wholeMap = {};
  recs.forEach((rec) => {
    const wKey = rec.whole;
    if (!wholeMap[wKey]) wholeMap[wKey] = { name: wKey, branches: {}, qty: 0, rev: 0, byCol: {} };
    const w = wholeMap[wKey];
    if (!w.branches[rec.branch]) w.branches[rec.branch] = { name: rec.branch, qty: 0, rev: 0, byCol: {} };
    const b = w.branches[rec.branch];
    const k = keyOf(rec);
    b.byCol[k] = (b.byCol[k] || 0) + rec.qty;
    w.byCol[k] = (w.byCol[k] || 0) + rec.qty;
    b.qty += rec.qty; b.rev += rec.rev;
    w.qty += rec.qty; w.rev += rec.rev;
  });

  const wholesalers = Object.values(wholeMap)
    .map((w) => ({ ...w, branches: Object.values(w.branches).sort((a, b) => b.qty - a.qty) }))
    .sort((a, b) => b.qty - a.qty);

  // active columns only (drop all-zero months/weeks)
  const activeCols = cols.filter((c) => wholesalers.some((w) => (w.byCol[c] || 0) > 0));
  const totals = { byCol: {}, qty: 0, rev: 0 };
  wholesalers.forEach((w) => {
    activeCols.forEach((c) => (totals.byCol[c] = (totals.byCol[c] || 0) + (w.byCol[c] || 0)));
    totals.qty += w.qty; totals.rev += w.rev;
  });
  return { wholesalers, activeCols, totals };
}

// ============================================================
//  LIVE DATA STORE (shared between Settings inputs and Dashboard)
//  Settings holds the CSV link inputs; Dashboard renders the data.
// ============================================================
const LIVE = {
  urls: { monthly: "", kpi: "", simon: "", mudassar: "", b2b: "" },
  data: null,      // parsed Monthly Tracking (KPIs / charts)
  cats: null,      // parsed channel achievement categories (from KPI link)
  poRecs: null,    // combined Confirmed PO records
  status: "",
};

async function loadLiveData(onDone) {
  const fetchText = async (url) => {
    if (!url || !url.trim()) return null;
    const res = await fetch(url.trim());
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.text();
  };
  const u = LIVE.urls;
  const anyUrl = u.monthly || u.kpi || u.simon || u.mudassar || u.b2b;
  if (!anyUrl) { LIVE.status = "Enter at least one published CSV link in Settings."; onDone && onDone(); return; }
  LIVE.status = "Loading…"; onDone && onDone();
  try {
    let monthlyOk = false;
    if (u.monthly) {
      const t = await fetchText(u.monthly);
      if (t) { LIVE.data = parseMonthlyCSV(t); monthlyOk = true; }
    }
    // KPI link → channel achievement (Retail / B2B / eCommerce). Falls back to monthly tab.
    let kpiOk = false;
    if (u.kpi) {
      const t = await fetchText(u.kpi);
      if (t) {
        const parsed = parseMonthlyCSV(t);
        if (parsed.categories) { LIVE.cats = parsed.categories; kpiOk = true; }
        if (!monthlyOk && parsed) { LIVE.data = parsed; }
      }
    } else if (monthlyOk && LIVE.data && LIVE.data.categories) {
      LIVE.cats = LIVE.data.categories; // monthly tab also carries the KPI section
    }
    const poTexts = [];
    for (const k of ["simon", "mudassar", "b2b"]) {
      try { const t = await fetchText(u[k]); if (t) poTexts.push(t); } catch (e) {}
    }
    let allRecs = [];
    poTexts.forEach((t) => { try { allRecs = allRecs.concat(parsePOOrders(t)); } catch (e) {} });
    if (allRecs.length === 0 && u.monthly) {
      try { const t = await fetchText(u.monthly); if (t) allRecs = parsePOOrders(t); } catch (e) {}
    }
    LIVE.poRecs = allRecs.length ? allRecs : null;
    const parts = [];
    if (monthlyOk) parts.push("KPIs");
    if (kpiOk) parts.push("Channels");
    if (allRecs.length) parts.push(`${allRecs.length} PO rows`);
    LIVE.status = (parts.length ? "Connected (" + parts.join(" · ") + ")" : "Connected") + " · " + new Date().toLocaleTimeString();
  } catch (e) {
    LIVE.status = "Could not load — check links are published CSV (…/pub?…output=csv).";
  }
  onDone && onDone();
}

                    <span style={PO.cRev}>{fmtGBP0(b.rev)}</span>
                  </div>
                ))}
                <div style={{ ...PO.grid(poAgg.activeCols.length), ...PO.subRow }}>
                  <span style={PO.cWhole}></span>
                  <span style={PO.cBranch}>{w.name} subtotal</span>
                  {poAgg.activeCols.map((c) => <span key={c} style={PO.cNum}>{w.byCol[c] || "·"}</span>)}
                  <span style={PO.cTot}>{w.qty.toLocaleString()}</span>
                  <span style={PO.cRev}>{fmtGBP0(w.rev)}</span>
                </div>
              </React.Fragment>
            ))}

            <div style={{ ...PO.grid(poAgg.activeCols.length), ...PO.totRow }}>
              <span style={PO.cWhole}>TOTAL</span>
              <span style={PO.cBranch}></span>
              {poAgg.activeCols.map((c) => <span key={c} style={PO.cNum}>{poAgg.totals.byCol[c] || "·"}</span>)}
              <span style={PO.cTot}>{poAgg.totals.qty.toLocaleString()}</span>
              <span style={PO.cRev}>{fmtGBP0(poAgg.totals.rev)}</span>
            </div>
          </div>
        )}
        <div style={S.footNote}>
          Confirmed PO only. SKU pricing: Socket £{PO_SKU_PRICE.socket} · 5M £{PO_SKU_PRICE.c5m} · 7.5M £{PO_SKU_PRICE.c75m} · MX22 £{PO_SKU_PRICE.mx22}. Source — Simon / Mudassar / B2B Order Master.
        </div>
      </section>
    </div>
  );
}

// ============================================================
//  SEGMENT SIMULATION (2026 only)
//  Existing channel run-rate + add pipeline customers
// ============================================================
// (FCST channel definitions now live in EV_CATEGORIES / EV_CAT_KEYS above.)


function SegmentSim() {
  // Channel-based forecasting (original UX) with a 9-slot store: each Case × Year saved independently.
  const [caseKey, setCaseKey] = useState("base");
  const [year, setYear] = useState(2026);

  // load the slot for the current Case×Year (or defaults) into editable state
  const initInputs = (ck, yr) => {
    const slot = getSlot(loadFcstSlots(), ck, yr);
    return slot ? JSON.parse(JSON.stringify(slot)) : defaultFcstInputs(ck, yr);
  };
  const [inp, setInp] = useState(() => initInputs("base", 2026));
  const [saveMsg, setSaveMsg] = useState("");

  const rr = inp.rr, pipe = inp.pipe, stb = inp.stb;
  const isGrowth = inp.mode === "growth";
  const growthPct = inp.growthPct || 0;
  const setGrowthPct = (v) => setInp((p) => ({ ...p, growthPct: Math.max(0, +v || 0) }));
  const setMode = (m) => setInp((p) => ({ ...p, mode: m }));
  const setRr = (updater) => setInp((p) => ({ ...p, rr: typeof updater === "function" ? updater(p.rr) : updater }));
  const setPipe = (updater) => setInp((p) => ({ ...p, pipe: typeof updater === "function" ? updater(p.pipe) : updater }));
  const setStb = (v) => setInp((p) => ({ ...p, stb: Math.max(0, v | 0) }));

  // switch slot: load that slot's saved inputs (or defaults) — each slot is an independent workspace
  const switchSlot = (ck, yr) => {
    setCaseKey(ck); setYear(yr);
    setInp(initInputs(ck, yr));
    setSaveMsg("");
  };

  const saveCurrent = () => {
    saveSlot(caseKey, year, inp);
    setSaveMsg(`Saved ${SCEN.find((s) => s.key === caseKey).label} · ${year} → syncing to shared store…`);
    setTimeout(() => setSaveMsg(CLOUD_STATUS || "Saved"), 1500);
  };
  const resetCurrent = () => {
    setInp(defaultFcstInputs(caseKey, year));
    setSaveMsg("Reset this slot to defaults (not yet saved)");
  };
  const syncNow = () => {
    setSaveMsg("Syncing from shared store…");
    cloudLoad((changed) => {
      setInp(initInputs(caseKey, year)); // reload current slot from refreshed cache
      setSaveMsg(CLOUD_STATUS || (changed ? "Synced" : "No change"));
    });
  };

  const addPipe = () => {
    setInp((p) => ({ ...p, pipe: [...p.pipe, { id: p.nid, name: "New customer", type: "Dealer", monthly: 10, startMonth: 7, product: "MX7" }], nid: p.nid + 1 }));
  };
  const updPipe = (id, k, v) => setPipe((arr) => arr.map((x) => (x.id === id ? { ...x, [k]: v } : x)));
  const delPipe = (id) => setPipe((arr) => arr.filter((x) => x.id !== id));

  const calc = useMemo(() => {
    const monthlyUnits = SEG_MONTHS.map(() => 0);
    const monthlyRev = SEG_MONTHS.map(() => 0);
    const segTotals = {};

    if (isGrowth) {
      // GROWTH mode: scale the same case's 2026 EV-category base by (1 + growthPct/100).
      // EV categories map back onto the SEG_BASE channels for the summary view.
      const slots = loadFcstSlots();
      const b2026 = base2026CatBase(slots, caseKey); // {wholesaler, distributor, ecommerce, dealer, fleet, cpo}
      const f = 1 + growthPct / 100;
      // map EV-category → the SEG_BASE channel rows used by this UI
      const catToSeg = { wholesaler: "wholesaler", distributor: "distributor", ecommerce: "ecom", dealer: "dealer_base", fleet: "b2b_base" };
      let evTotal = 0;
      SEG_BASE.forEach((s) => {
        const catKey = Object.keys(catToSeg).find((k) => catToSeg[k] === s.key);
        const u = Math.round((b2026[catKey] || 0) * f);
        evTotal += u;
        segTotals[s.key] = { label: s.label, units: u, rev: u * prodPrice(s.product), color: s.color, mx7: s.product === "MX22" ? 0 : u, mx22: s.product === "MX22" ? u : 0 };
      });
      // 'cpo' EV-category (Installer/MDU/CPO pipeline in 2026) shows as a synthetic Commercial row
      const cpoU = Math.round((b2026.cpo || 0) * f);
      evTotal += cpoU;
      const totRev = SEG_BASE.reduce((a, s) => a + segTotals[s.key].rev, 0) + cpoU * prodPrice("MX22");
      // spread evenly across 12 months purely for the chart
      const perMonth = evTotal / 12;
      for (let m = 0; m < 12; m++) { monthlyUnits[m] = perMonth; monthlyRev[m] = totRev / 12; }
      const totMx7 = SEG_BASE.reduce((a, s) => a + segTotals[s.key].mx7, 0);
      const totMx22 = SEG_BASE.reduce((a, s) => a + segTotals[s.key].mx22, 0) + cpoU;
      const base2026Total = Object.values(b2026).reduce((a, v) => a + (v || 0), 0);
      return { monthlyUnits, monthlyRev, segTotals, pipeTotals: [], totUnits: evTotal, totRev, totMx7, totMx22, cpoU, base2026Total };
    }

    SEG_BASE.forEach((s) => {
      let u = 0;
      for (let m = 0; m < 12; m++) {
        const units = m < 6 ? s.ytd / 6 : rr[s.key];
        u += units;
        monthlyUnits[m] += units;
        monthlyRev[m] += units * prodPrice(s.product);
      }
      segTotals[s.key] = { label: s.label, units: u, rev: u * prodPrice(s.product), color: s.color, mx7: s.product === "MX22" ? 0 : u, mx22: s.product === "MX22" ? u : 0 };
    });
    const pipeTotals = pipe.map((c) => {
      let u = 0;
      for (let m = 0; m < 12; m++) {
        if (m + 1 >= c.startMonth) { u += c.monthly; monthlyUnits[m] += c.monthly; monthlyRev[m] += c.monthly * prodPrice(c.product); }
      }
      return { ...c, units: u, rev: u * prodPrice(c.product), mx7: c.product === "MX22" ? 0 : u, mx22: c.product === "MX22" ? u : 0 };
    });
    const totUnits = monthlyUnits.reduce((a, b) => a + b, 0);
    const totRev = monthlyRev.reduce((a, b) => a + b, 0);
    const totMx7 = SEG_BASE.reduce((a, s) => a + segTotals[s.key].mx7, 0) + pipeTotals.reduce((a, c) => a + c.mx7, 0);
    const totMx22 = SEG_BASE.reduce((a, s) => a + segTotals[s.key].mx22, 0) + pipeTotals.reduce((a, c) => a + c.mx22, 0);
    return { monthlyUnits, monthlyRev, segTotals, pipeTotals, totUnits, totRev, totMx7, totMx22 };
  }, [rr, pipe, isGrowth, growthPct, caseKey]);

  const maxMonthly = Math.max(...calc.monthlyUnits, 1);
  const fmtGBP0 = (n) => "£" + Math.round(n).toLocaleString();
  const baseTotal = SEG_BASE.reduce((a, s) => a + calc.segTotals[s.key].units, 0);
  const pipeTotal = calc.pipeTotals.reduce((a, c) => a + c.units, 0);
  const caseColor = SCEN.find((s) => s.key === caseKey).color;
  const slotSaved = !!getSlot(loadFcstSlots(), caseKey, year);
  const stbRev = (stb || 0) * PRICE.stb_fhr;

  return (
    <div>
      <div style={SG.actionBar}>
        <div style={SG.actionInfo}>
          <span style={SG.actionTitle}>FCST Simulation — {SCEN.find((s) => s.key === caseKey).label} · {year}</span>
          <span style={SG.actionMsg}>{saveMsg || (slotSaved ? "Editing a saved slot. Adjust channels, then Save to update the 3-Year Simulator." : "New slot. Build the forecast, then Save to link it to the 3-Year Simulator.")}</span>
        </div>
        <div style={SG.actionBtns}>
          <button style={SG.saveBtn} onClick={saveCurrent}>Save</button>
          <button style={SG.resetBtn} onClick={syncNow}>↻ Sync</button>
          <button style={SG.resetBtn} onClick={resetCurrent}>Reset</button>
        </div>
      </div>

      {/* slot selector: Case × Year */}
      <div style={S.selectorRow}>
        <div style={S.segGroup}>
          {SCEN.map((s) => (
            <button key={s.key} onClick={() => switchSlot(s.key, year)}
              style={{ ...S.seg, ...(caseKey === s.key ? { background: s.color, color: "#fff", borderColor: s.color } : {}) }}>
              {s.label}
            </button>
          ))}
        </div>
        <div style={S.segGroup}>
          {YEARS.map((y) => (
            <button key={y} onClick={() => switchSlot(caseKey, y)}
              style={{ ...S.seg, ...(year === y ? S.segActiveDark : {}) }}>
              {y}
            </button>
          ))}
        </div>
        <span style={{ ...SG.slotTag, color: slotSaved ? HX.azure : HX.muted }}>{slotSaved ? "● saved" : "○ unsaved"}</span>
      </div>

      {year !== 2026 && (
        <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 14px", background: "#eef3f8", borderRadius: 8, marginBottom: 16, flexWrap: "wrap" }}>
          <span style={{ fontSize: 13, fontWeight: 600, color: HX.ink }}>{year} forecast method:</span>
          <div style={S.segGroup}>
            <button onClick={() => setMode("growth")} style={{ ...S.seg, ...(isGrowth ? { background: HX.azure, color: "#fff", borderColor: HX.azure } : {}) }}>% Growth over 2026</button>
            <button onClick={() => setMode("channel")} style={{ ...S.seg, ...(!isGrowth ? S.segActiveDark : {}) }}>Channel-by-channel</button>
          </div>
          {isGrowth && <span style={{ fontSize: 12, color: HX.muted }}>Scales the same scenario's 2026 EV units by the growth % below.</span>}
        </div>
      )}

      <div style={{ ...D.kpiRow, gridTemplateColumns: "repeat(5, 1fr)" }}>
        <div style={D.kpi}>
          <div style={D.kpiLabel}>{SCEN.find((s) => s.key === caseKey).label} · {year} — EV Units</div>
          <div style={{ ...D.kpiVal, color: caseColor }}>{Math.round(calc.totUnits).toLocaleString()}</div>
          <div style={D.kpiSub}>BP {DASH.ev.bpQty.toLocaleString()} units</div>
          <div style={D.kpiBarWrap}>
            <div style={{ ...D.kpiBar, width: `${Math.min((calc.totUnits / DASH.ev.bpQty) * 100, 100)}%`, background: caseColor }} />
            <span style={D.kpiAch}>{((calc.totUnits / DASH.ev.bpQty) * 100).toFixed(1)}% of BP</span>
          </div>
        </div>
        <div style={D.kpi}>
          <div style={D.kpiLabel}>EV Revenue</div>
          <div style={{ ...D.kpiVal, color: HX.azure }}>{fmtGBP0(calc.totRev)}</div>
          <div style={D.kpiSub}>BP {fmtGBP0(DASH.ev.bpRev)}</div>
          <div style={D.kpiBarWrap}>
            <div style={{ ...D.kpiBar, width: `${Math.min((calc.totRev / DASH.ev.bpRev) * 100, 100)}%`, background: HX.azure }} />
            <span style={D.kpiAch}>{((calc.totRev / DASH.ev.bpRev) * 100).toFixed(1)}% of BP</span>
          </div>
        </div>
        <div style={D.kpi}>
          <div style={D.kpiLabel}>STB Units</div>
          <div style={{ ...D.kpiVal, color: HX.forest }}>{(stb || 0).toLocaleString()}</div>
          <div style={D.kpiSub}>BP {DASH.stb.bpQty.toLocaleString()} units</div>
          <div style={D.kpiBarWrap}>
            <div style={{ ...D.kpiBar, width: `${Math.min(((stb || 0) / DASH.stb.bpQty) * 100, 100)}%`, background: HX.forest }} />
            <span style={D.kpiAch}>{(((stb || 0) / DASH.stb.bpQty) * 100).toFixed(1)}% of BP</span>
          </div>
        </div>
        <div style={D.kpi}>
          <div style={D.kpiLabel}>STB Revenue</div>
          <div style={{ ...D.kpiVal, color: HX.forest }}>{fmtGBP0(stbRev)}</div>
          <div style={D.kpiSub}>BP {fmtGBP0(DASH.stb.bpRev)}</div>
          <div style={D.kpiBarWrap}>
            <div style={{ ...D.kpiBar, width: `${Math.min((stbRev / DASH.stb.bpRev) * 100, 100)}%`, background: HX.forest }} />
            <span style={D.kpiAch}>{((stbRev / DASH.stb.bpRev) * 100).toFixed(1)}% of BP</span>
          </div>
        </div>
        <div style={D.kpi}>
          <div style={D.kpiLabel}>Total Revenue</div>
          <div style={{ ...D.kpiVal, color: HX.indigo }}>{fmtGBP0(calc.totRev + stbRev)}</div>
          <div style={D.kpiSub}>BP {fmtGBP0(DASH.grand.bpRev)}</div>
          <div style={D.kpiBarWrap}>
            <div style={{ ...D.kpiBar, width: `${Math.min(((calc.totRev + stbRev) / DASH.grand.bpRev) * 100, 100)}%`, background: HX.indigo }} />
            <span style={D.kpiAch}>{(((calc.totRev + stbRev) / DASH.grand.bpRev) * 100).toFixed(1)}% of BP</span>
          </div>
        </div>
      </div>

      <section style={S.panel}>
        <h2 style={S.h2}>{year} Monthly EV Volume {isGrowth ? "(even spread — illustrative)" : "(Existing + Pipeline)"}</h2>
        <div style={D.chart}>
          {SEG_MONTHS.map((m, i) => (
            <div key={m} style={D.barCol}>
              <div style={D.barStack}>
                <div style={{ ...D.barActual, width: "60%", height: `${(calc.monthlyUnits[i] / maxMonthly) * 100}%`, background: isGrowth ? caseColor : (i < 6 ? "#c4d0dc" : HX.azure) }} title={`${Math.round(calc.monthlyUnits[i])} units`} />
              </div>
              <div style={D.barLabel}>{m}</div>
              <div style={SG.barNum}>{Math.round(calc.monthlyUnits[i])}</div>
            </div>
          ))}
        </div>
        <div style={D.legend}>
          {isGrowth ? (
            <span><i style={{ ...D.dot, background: caseColor }} /> {year} = 2026 × (1 + {growthPct}%), shown evenly across months</span>
          ) : (<>
            <span><i style={{ ...D.dot, background: "#c4d0dc" }} /> Jan–Jun (actual run-rate)</span>
            <span><i style={{ ...D.dot, background: HX.azure }} /> Jul–Dec (forecast)</span>
          </>)}
        </div>
      </section>

      {isGrowth ? (
      <div style={D.grid2}>
        <section style={S.panel}>
          <h2 style={S.h2}>{year} Growth over 2026 ({SCEN.find((s) => s.key === caseKey).label})</h2>
          <div style={S.panelNote}>Set total EV growth vs the same scenario's 2026 forecast. Channel mix is held at the 2026 proportions.</div>
          <div style={S.sliderRow}>
            <div style={S.sliderHead}>
              <span style={S.sliderName}><i style={{ ...D.dot, background: caseColor }} />EV growth vs 2026</span>
              <span style={S.sliderVal}>+{growthPct}%</span>
            </div>
            <input type="range" min="0" max="300" step="5" value={growthPct} onChange={(e) => setGrowthPct(+e.target.value)} style={S.range} />
            <div style={S.sliderSub}>2026 base {Math.round(calc.base2026Total || 0).toLocaleString()} units → {year} {Math.round(calc.totUnits).toLocaleString()} units</div>
          </div>
          <div style={{ ...S.sliderRow, marginTop: 6 }}>
            <div style={S.sliderHead}>
              <span style={S.sliderName}>Or type exact %</span>
              <span style={S.sliderVal}>{Math.round(calc.totUnits).toLocaleString()} EV units</span>
            </div>
            <input type="number" min="0" value={growthPct} onChange={(e) => setGrowthPct(+e.target.value)} style={SG.cellInput} />
          </div>
          <div style={{ ...S.blockLabel, marginTop: 18 }}>STB — FHR-6000T (£{PRICE.stb_fhr}/unit)</div>
          <div style={SG.cellRow}>
            <span style={SG.cellName}>STB units for {year}<em style={SG.cellNote}>{(stb || 0).toLocaleString()} × £{PRICE.stb_fhr} = {fmtGBP0(stbRev)}</em></span>
            <input type="number" min="0" value={stb || 0} onChange={(e) => setStb(+e.target.value)} style={SG.cellInput} />
          </div>
        </section>

        <section style={S.panel}>
          <h2 style={S.h2}>Implied Channel Mix ({year})</h2>
          <div style={S.panelNote}>2026 channel split scaled by +{growthPct}%. Switch to "Channel-by-channel" above to edit each channel directly.</div>
          {SEG_BASE.map((s) => (
            <div key={s.key} style={S.sliderRow}>
              <div style={S.sliderHead}>
                <span style={S.sliderName}><i style={{ ...D.dot, background: s.color }} />{s.label}</span>
                <span style={S.sliderVal}>{Math.round(calc.segTotals[s.key].units).toLocaleString()} units · {fmtGBP0(calc.segTotals[s.key].rev)}</span>
              </div>
            </div>
          ))}
          {calc.cpoU > 0 && (
            <div style={S.sliderRow}>
              <div style={S.sliderHead}>
                <span style={S.sliderName}><i style={{ ...D.dot, background: HX.sunshine }} />Commercial / Installer (MX22)</span>
                <span style={S.sliderVal}>{Math.round(calc.cpoU).toLocaleString()} units</span>
              </div>
            </div>
          )}
        </section>
      </div>
      ) : (
      <div style={D.grid2}>
        <section style={S.panel}>
          <h2 style={S.h2}>Existing Channels — H2 Run-Rate</h2>
          <div style={S.panelNote}>Jan–Jun uses actual YTD; sliders set Jul–Dec monthly units per channel.</div>
          {SEG_BASE.map((s) => (
            <div key={s.key} style={S.sliderRow}>
              <div style={S.sliderHead}>
                <span style={S.sliderName}><i style={{ ...D.dot, background: s.color }} />{s.label}</span>
                <span style={S.sliderVal}>{Math.round(calc.segTotals[s.key].units).toLocaleString()} units · {fmtGBP0(calc.segTotals[s.key].rev)}</span>
              </div>
              <input type="range" min="0" max="200" value={rr[s.key]} onChange={(e) => setRr((p) => ({ ...p, [s.key]: +e.target.value }))} style={S.range} />
              <div style={S.sliderSub}>YTD {s.ytd} · H2 run-rate {rr[s.key]}/mo · {s.product}</div>
            </div>
          ))}
          <div style={{ ...S.blockLabel, marginTop: 18 }}>STB — FHR-6000T (£{PRICE.stb_fhr}/unit)</div>
          <div style={SG.cellRow}>
            <span style={SG.cellName}>STB units for {year}<em style={SG.cellNote}>{(stb || 0).toLocaleString()} × £{PRICE.stb_fhr} = {fmtGBP0(stbRev)}</em></span>
            <input type="number" min="0" value={stb || 0} onChange={(e) => setStb(+e.target.value)} style={SG.cellInput} />
          </div>
        </section>

        <section style={S.panel}>
          <div style={SG.pipeHead}>
            <h2 style={{ ...S.h2, margin: 0 }}>Pipeline Customers</h2>
            <button onClick={addPipe} style={SG.addBtn}>+ Add</button>
          </div>
          <div style={S.panelNote}>Add Wholesaler / Distributor / Installer / Dealer / Fleet / Rental·Leasing / MDU / CPO and set monthly units, start month, product.</div>
          {pipe.map((c) => (
            <div key={c.id} style={SG.pipeCard}>
              <div style={SG.pipeRow1}>
                <input value={c.name} onChange={(e) => updPipe(c.id, "name", e.target.value)} style={SG.nameInput} />
                <button onClick={() => delPipe(c.id)} style={SG.delBtn}>✕</button>
              </div>
              <div style={SG.pipeRow2}>
                <select value={c.type} onChange={(e) => updPipe(c.id, "type", e.target.value)} style={SG.sel}>
                  {PIPELINE_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
                </select>
                <select value={c.product} onChange={(e) => updPipe(c.id, "product", e.target.value)} style={SG.selSm}>
                  <option value="MX7">MX7</option>
                  <option value="MX22">MX22</option>
                </select>
              </div>
              <div style={SG.pipeRow3}>
                <label style={SG.miniLabel}>Units/mo
                  <input type="number" min="0" value={c.monthly} onChange={(e) => updPipe(c.id, "monthly", +e.target.value)} style={SG.numInput} />
                </label>
                <label style={SG.miniLabel}>Start
                  <select value={c.startMonth} onChange={(e) => updPipe(c.id, "startMonth", +e.target.value)} style={SG.selSm}>
                    {SEG_MONTHS.map((m, i) => <option key={m} value={i + 1}>{m}</option>)}
                  </select>
                </label>
                <span style={SG.pipeResult}>{(() => { const ct = calc.pipeTotals.find((x) => x.id === c.id); return ct ? `${ct.units.toLocaleString()} units · ${fmtGBP0(ct.rev)}` : ""; })()}</span>
              </div>
            </div>
          ))}
        </section>
      </div>
      )}

      <section style={S.panel}>
        <h2 style={S.h2}>{SCEN.find((s) => s.key === caseKey).label} · {year} — Channel Summary</h2>
        <div style={SG.tbl}>
          <div style={{ ...SG.tr, ...SG.trHead }}>
            <span>Channel</span><span style={SG.tRight}>MX7</span><span style={SG.tRight}>MX22</span><span style={SG.tRight}>Total</span><span style={SG.tRight}>Revenue (£)</span><span style={SG.tRight}>Share</span>
          </div>
          {SEG_BASE.map((s) => {
            const t = calc.segTotals[s.key];
            return (
              <div key={s.key} style={SG.tr}>
                <span><i style={{ ...D.dot, background: s.color }} />{t.label}</span>
                <span style={SG.tRight}>{Math.round(t.mx7).toLocaleString()}</span>
                <span style={SG.tRight}>{Math.round(t.mx22).toLocaleString()}</span>
                <span style={SG.tRight}>{Math.round(t.units).toLocaleString()}</span>
                <span style={SG.tRight}>{fmtGBP0(t.rev)}</span>

          <div style={{ ...SG.tr, ...SG.trTotal }}>
            <span>Total</span>
            <span style={SG.tRight}>{Math.round(calc.totMx7).toLocaleString()}</span>
            <span style={SG.tRight}>{Math.round(calc.totMx22).toLocaleString()}</span>

        </div>

          Editing <b>{SCEN.find((s) => s.key === caseKey).label} · {year}</b>. Switch Case/Year above to build other slots — each is saved independently and linked to the matching cell in the 3-Year Simulator.
          MX7 blended £{prodPrice("MX7").toFixed(0)}/unit · MX22 £{prodPrice("MX22").toFixed(0)}/unit · FX {getFX()} KRW/£. Remember to Save.
        </div>
      </section>
    </div>
  );
}

function Settings({ onChange }) {
  const [, force] = useState(0);
  const set = (path, v) => {
    const num = v === "" ? 0 : +v;
    const [grp, key] = path.split(".");
    CONFIG[grp][key] = num;
    force((x) => x + 1);
    onChange && onChange();
  };

  const priceRows = [
    ["MX7 Socket", "price.ev_socket"],
    ["MX7 5M", "price.ev_5m"],
    ["MX7 7.5M", "price.ev_75m"],
    ["MX Pro 22kW (MX22)", "price.ev_22kw"],
    ["STB FHR-6000T", "price.stb_fhr"],
  ];
  const mixRows = [
    ["Socket weight", "mix.socket"],
    ["5M weight", "mix.c5m"],
    ["7.5M weight", "mix.c75m"],
  ];
  const gmRows = [
    ["EV", "gm.ev"],
    ["STB", "gm.stb"],
    ["BT", "gm.bt"],
  ];
  const mixSum = CONFIG.mix.socket + CONFIG.mix.c5m + CONFIG.mix.c75m;

  const Field = ({ label, path, step, suffix, prefix }) => {
    const [grp, key] = path.split(".");
    return (
      <div style={ST.field}>
        <label style={ST.fieldLabel}>{label}</label>
        <div style={ST.inputWrap}>
          {prefix && <span style={ST.affix}>{prefix}</span>}
          <input type="number" step={step || "0.01"} value={CONFIG[grp][key]}
            onChange={(e) => set(path, e.target.value)} style={ST.input} />
          {suffix && <span style={ST.affix}>{suffix}</span>}
        </div>
      </div>
    );
  };

  return (
    <div>
      <div style={ST.banner}>
        These values are the single source of truth. Editing them updates the Dashboard, FCST Simulation, and 3-Year Simulator instantly.
      </div>

      <div style={D.grid2}>
        <section style={S.panel}>
          <h2 style={S.h2}>Model Prices (GBP)</h2>
          <div style={S.panelNote}>Per-unit selling price by model.</div>
          {priceRows.map(([l, p]) => <Field key={p} label={l} path={p} prefix="£" step="0.01" />)}
          <div style={{ ...S.catTotal, marginTop: 16 }}>
            <span style={S.catTotalLabel}>EV Home Blended</span>
            <span style={S.catTotalVal}>£{evBlended().toFixed(2)}/unit</span>
          </div>
        </section>

        <section style={S.panel}>
          <h2 style={S.h2}>Margin Rate & FX</h2>
          <div style={S.panelNote}>Gross margin by line and KRW/GBP exchange rate.</div>
          <div style={S.blockLabel}>Gross Margin (%)</div>
          {gmRows.map(([l, p]) => {
            const [grp, key] = p.split(".");
            return (
              <div key={p} style={ST.field}>
                <label style={ST.fieldLabel}>{l}</label>
                <div style={ST.inputWrap}>
                  <input type="number" step="1" value={+(CONFIG[grp][key] * 100).toFixed(1)}
                    onChange={(e) => { CONFIG[grp][key] = (e.target.value === "" ? 0 : +e.target.value) / 100; force((x) => x + 1); onChange && onChange(); }}
                    style={ST.input} />
                  <span style={ST.affix}>%</span>
                </div>
              </div>
            );
          })}
          <div style={{ ...S.blockLabel, marginTop: 16 }}>Exchange Rate</div>
          <div style={ST.field}>
            <label style={ST.fieldLabel}>KRW per GBP</label>
            <div style={ST.inputWrap}>
              <span style={ST.affix}>₩</span>
              <input type="number" step="0.001" value={CONFIG.fx}
                onChange={(e) => { CONFIG.fx = e.target.value === "" ? 0 : +e.target.value; force((x) => x + 1); onChange && onChange(); }}
                style={ST.input} />
            </div>
          </div>

          <div style={{ ...S.blockLabel, marginTop: 16 }}>EV Home Mix Weights</div>
          <div style={S.panelNote}>How MX7 sales split across variants (used for the blended EV price). Sum: {(mixSum * 100).toFixed(0)}%{Math.abs(mixSum - 1) > 0.001 ? " ⚠ should be 100%" : " ✓"}</div>
          {mixRows.map(([l, p]) => <Field key={p} label={l} path={p} step="0.05" suffix="" />)}
        </section>
      </div>

      <section style={S.panel}>
        <div style={DL.panelHead}>
          <div style={DL.connInfo}>
            <span style={DL.connDot(LIVE.data || LIVE.poRecs)} />
            <h2 style={{ ...S.h2, margin: 0 }}>Google Sheet Live Link</h2>
          </div>
          <div style={DL.btns}>
            <button style={DL.connBtn} onClick={() => loadLiveData(() => { force((x) => x + 1); onChange && onChange(); })}>Connect</button>
            <button style={DL.connBtnGhost} onClick={() => loadLiveData(() => { force((x) => x + 1); onChange && onChange(); })} title="Refresh">↻</button>
          </div>
        </div>
        <div style={S.panelNote}>{LIVE.status || "Paste each tab's published CSV link (…/pub?gid=…&output=csv), then Connect. Data appears on the Sales Dashboard."}</div>
        <div style={DL.inputGrid}>
          <label style={DL.inLabel}>Monthly Tracking
            <input style={DL.connInput} placeholder="…/pub?gid=…&output=csv (KPIs & charts)"
              defaultValue={LIVE.urls.monthly} onChange={(e) => { LIVE.urls.monthly = e.target.value; }} />
          </label>
          <label style={DL.inLabel}>KPI — Channel Achievement
            <input style={DL.connInput} placeholder="…/pub?gid=…&output=csv (Retail / B2B / eCommerce)"
              defaultValue={LIVE.urls.kpi} onChange={(e) => { LIVE.urls.kpi = e.target.value; }} />
          </label>
          <label style={DL.inLabel}>Simon — Order Master
            <input style={DL.connInput} placeholder="…/pub?gid=…&output=csv (PO detail)"
              defaultValue={LIVE.urls.simon} onChange={(e) => { LIVE.urls.simon = e.target.value; }} />
          </label>
          <label style={DL.inLabel}>Mudassar — Order Master
            <input style={DL.connInput} placeholder="…/pub?gid=…&output=csv (PO detail)"
              defaultValue={LIVE.urls.mudassar} onChange={(e) => { LIVE.urls.mudassar = e.target.value; }} />
          </label>
          <label style={DL.inLabel}>B2B — Order Master
            <input style={DL.connInput} placeholder="…/pub?gid=…&output=csv (PO detail)"
              defaultValue={LIVE.urls.b2b} onChange={(e) => { LIVE.urls.b2b = e.target.value; }} />
          </label>
        </div>
        <div style={DL.hint}>Monthly Tracking drives the Dashboard KPIs &amp; charts; the KPI link feeds the Channel Achievement bars (Retail = Simon + Mudassar, split EV Home / Commercial); the three Order Master tabs feed the Sales by Channel table &amp; Product Mix. Leave any blank to skip. File must be a Google Sheet (not .xlsx), each tab Published to web as CSV.</div>
      </section>

      <section style={S.panel}>
        <h2 style={S.h2}>Current Effective Values</h2>
        <div style={ST.summaryGrid}>
          <div style={ST.sumCard}><div style={ST.sumLabel}>EV Blended</div><div style={ST.sumVal}>£{evBlended().toFixed(2)}</div></div>
          <div style={ST.sumCard}><div style={ST.sumLabel}>MX22 / Commercial</div><div style={ST.sumVal}>£{PRICE.ev_22kw.toFixed(0)}</div></div>
          <div style={ST.sumCard}><div style={ST.sumLabel}>STB</div><div style={ST.sumVal}>£{PRICE.stb_fhr.toFixed(0)}</div></div>
          <div style={ST.sumCard}><div style={ST.sumLabel}>EV / STB / BT GM</div><div style={ST.sumVal}>{(GM.ev*100).toFixed(0)}/{(GM.stb*100).toFixed(0)}/{(GM.bt*100).toFixed(0)}%</div></div>
          <div style={ST.sumCard}><div style={ST.sumLabel}>FX</div><div style={ST.sumVal}>₩{getFX().toLocaleString()}</div></div>
        </div>
        <div style={S.footNote}>
          Changes apply immediately across all tabs for this session. Reload restores defaults (MX7 Socket £332.14 / 5M £342.37 / 7.5M £357.73 · MX22 £579 · STB £153 · GM 20/20/100% · FX 1810.195).
        </div>
      </section>
    </div>
  );
}

  useEffect(() => {
