<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HUMAX UK — Revenue & Scenario Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>html,body{margin:0;padding:0;background:#f5f7fa;}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;

// ============================================================
//  HUK 3-Year P&L Simulator
//  EV (category-level) + STB (FHR-6000T) + BT maintenance
//  Adjustable revenue scenarios & cost-reduction levers
// ============================================================

// ---- Central configuration (editable in Settings; referenced by all pages) ----
// Mutable in-memory store. Settings page updates these; pages re-read on each render.
const CONFIG = {
  price: {
    ev_socket: 332.14,
    ev_5m: 342.37,
    ev_75m: 357.73,
    ev_22kw: 579.0,
    stb_fhr: 153.0,
  },
  // EV home blended mix weights (must sum to 1)
  mix: { socket: 0.5, c5m: 0.25, c75m: 0.25 },
  gm: { ev: 0.2, stb: 0.2, bt: 1.0 }, // gross margins
  fx: 1810.195, // KRW per GBP
};
// Back-compat references used throughout the app:
const PRICE = CONFIG.price;          // object ref — mutating properties is reflected everywhere
const GM = CONFIG.gm;                // object ref
const getFX = () => CONFIG.fx;       // FX can change, so read via function
const evBlended = () =>
  CONFIG.mix.socket * PRICE.ev_socket + CONFIG.mix.c5m * PRICE.ev_5m + CONFIG.mix.c75m * PRICE.ev_75m;
const prodPrice = (key) => (key === "MX22" ? PRICE.ev_22kw : evBlended());

// ---- EV categories: 2026 BP annual target (from Monthly Tracking) ----
// baseUnits = 2026 plan; we scale per scenario & per year
const EV_CATEGORIES = [
  { key: "wholesaler", label: "Wholesaler", base: 4220, note: "Yesss·CEF wholesale channel" },
  { key: "distributor", label: "Distributor", base: 600, note: "Stearn and mid-tier distribution" },
  { key: "ecommerce", label: "eCommerce", base: 272, note: "Argos·Online" },
  { key: "dealer", label: "Dealer", base: 1400, note: "BYD and dealerships" },
  { key: "fleet", label: "Fleet", base: 1500, note: "B2B Home/Commercial Fleet" },
  { key: "cpo", label: "CPO", base: 805, note: "Commercial B2B / CPO" },
];

// scenario multipliers vs BP target (Worst/Base/Best), per year
// 2026 anchored to realistic run-rate (Worst ≈ current pace), grows in 27/28
const SCENARIO_MULT = {
  worst: { 2026: 0.08, 2027: 0.16, 2028: 0.24 },
  base: { 2026: 0.14, 2027: 0.25, 2028: 0.40 },
  best: { 2026: 0.24, 2027: 0.40, 2028: 0.62 },
};

// STB FHR-6000T units by scenario (2026 BP = 20,280). Declines after.
const STB_UNITS = {
  worst: { 2026: 14196, 2027: 9000, 2028: 4500 },
  base: { 2026: 17238, 2027: 12000, 2028: 7000 },
  best: { 2026: 20280, 2027: 16000, 2028: 11000 },
};

// BT maintenance: £700k through 2027, removed 2028
const BT_REV = { 2026: 700000, 2027: 700000, 2028: 0 };

// Base fixed-cost budget (Jeff PL) & 2026 actual budget
const BASE_FIXED = 2154193;

const YEARS = [2026, 2027, 2028];
const SCEN = [
  { key: "worst", label: "Worst", color: "#d64545" },
  { key: "base", label: "Base", color: "#00B1A1" },
  { key: "best", label: "Best", color: "#163E35" },
];

const fmtGBP = (n) =>
  (n < 0 ? "−£" : "£") + Math.abs(Math.round(n)).toLocaleString();
const fmtM = (n) => (n < 0 ? "−£" : "£") + (Math.abs(n) / 1e6).toFixed(2) + "M";
const fmtKRW = (n) =>
  (n < 0 ? "−₩" : "₩") + Math.abs(Math.round(n * getFX())).toLocaleString();
const r0k = (n) => Math.round(n).toLocaleString();

// Map Segment Simulation inputs → 3-Year Simulator's 6 EV channels (2026 base units).
// Reads the saved Segment Sim snapshot from localStorage (same key the Segment page saves to).
function segmentToCatBase() {
  let snap = null;
  try {
    const raw = window.localStorage.getItem("huk_segment_sim");
    snap = raw ? JSON.parse(raw) : null;
  } catch (e) { snap = null; }
  if (!snap) return null;

  const rr = snap.rr || {};
  const pipe = snap.pipe || [];
  const cats = { wholesaler: 0, distributor: 0, ecommerce: 0, dealer: 0, fleet: 0, cpo: 0 };

  // existing channels: Jan-Jun actual (ytd) + Jul-Dec run-rate*6  → full-year 2026 units
  const baseMap = {}; SEG_BASE.forEach((s) => (baseMap[s.key] = s));
  const fullYear = (key) => {
    const s = baseMap[key]; if (!s) return 0;
    const h2 = (rr[key] != null ? rr[key] : s.runRate) * 6;
    return s.ytd + h2;
  };
  cats.wholesaler += fullYear("wholesaler");
  cats.distributor += fullYear("distributor"); // Stearn / Argos / Kelvelec
  cats.ecommerce += fullYear("ecom");
  cats.dealer += fullYear("dealer_base");
  cats.fleet += fullYear("b2b_base"); // ChargedEV B2B base → fleet bucket

  // pipeline customers: units = monthly × months from startMonth..Dec
  pipe.forEach((c) => {
    const months = Math.max(0, 12 - (c.startMonth - 1));
    const u = (c.monthly || 0) * months;
    switch (c.type) {
      case "Wholesaler": cats.wholesaler += u; break;
      case "Distributor": cats.distributor += u; break;
      case "Dealer": cats.dealer += u; break;
      case "eCommerce": cats.ecommerce += u; break;
      case "Fleet Manager":
      case "Rental / Leasing":
      case "Other B2B": cats.fleet += u; break;
      case "MDU / Housing":
      case "CPO":
      case "Installer": cats.cpo += u; break;
      default: cats.fleet += u;
    }
  });
  return cats;
}

function Simulator() {
  const [scenario, setScenario] = useState("base");
  const [year, setYear] = useState(2026);

  // Link to Segment Simulation: when on, 2026 channel base comes from the saved Segment Sim snapshot
  const segBase = segmentToCatBase();
  const [linkSegment, setLinkSegment] = useState(!!segBase);

  // active EV categories: default plan base, or Segment-linked base when toggle on
  const EV_CATS = (linkSegment && segBase)
    ? EV_CATEGORIES.map((c) => ({ ...c, base: Math.round(segBase[c.key] || 0) }))
    : EV_CATEGORIES;

  // EV category multiplier overrides (per category, % of BP target)
  const [catMult, setCatMult] = useState(() =>
    Object.fromEntries(EV_CATEGORIES.map((c) => [c.key, 100]))
  );
  // STB unit override (% of scenario default)
  const [stbAdj, setStbAdj] = useState(100);
  // Cost reduction lever (£ saved off fixed cost), applied from 2027
  const [savings, setSavings] = useState({ 2026: 0, 2027: 687000, 2028: 687000 });
  const [btKeep2028, setBtKeep2028] = useState(false);

  const setCat = (k, v) => setCatMult((p) => ({ ...p, [k]: v }));

  // ---- compute one year/scenario ----
  const compute = (sc, yr, useOverrides) => {
    const mult = SCENARIO_MULT[sc][yr];
    // When Segment-linked, the 2026 base IS the actual 2026 quantity (scenario already baked in),
    // so we do NOT re-apply the 2026 scenario multiplier. 2027/2028 still grow from it via their multipliers.
    const linked = linkSegment && segBase;
    let evUnits = 0;
    const catBreak = EV_CATS.map((c) => {
      const ov = useOverrides ? catMult[c.key] / 100 : 1;
      let u;
      if (linked && yr === 2026) {
        u = c.base * ov;                       // Segment value used directly as 2026 base
      } else if (linked) {
        // grow the linked 2026 base into 2027/2028 by the ratio of scenario multipliers
        const growth = mult / SCENARIO_MULT[sc][2026];
        u = c.base * growth * ov;
      } else {
        u = c.base * mult * ov;                // original BP-plan behaviour
      }
      evUnits += u;
      return { ...c, units: u, rev: u * evBlended() };
    });
    const evRev = evUnits * evBlended();
    // STB
    const stbBase = STB_UNITS[sc][yr];
    const stbU = stbBase * (useOverrides ? stbAdj / 100 : 1);
    const stbRev = stbU * PRICE.stb_fhr;
    // BT
    let btRev = BT_REV[yr];
    if (yr === 2028 && btKeep2028) btRev = 700000;
    // GP
    const gp = evRev * GM.ev + stbRev * GM.stb + btRev * GM.bt;
    const totRev = evRev + stbRev + btRev;
    const fixed = BASE_FIXED - (useOverrides ? savings[yr] : 0);
    const net = gp - fixed;
    return { evUnits, evRev, catBreak, stbU, stbRev, btRev, gp, totRev, fixed, net };
  };

  const cur = useMemo(() => compute(scenario, year, true), [scenario, year, catMult, stbAdj, savings, btKeep2028, linkSegment]);

  // 3-year x 3-scenario grid (with overrides applied to chosen scenario only? -> apply globally for comparison)
  const grid = useMemo(() => {
    const g = {};
    SCEN.forEach((s) => {
      g[s.key] = YEARS.map((y) => compute(s.key, y, s.key === scenario));
    });
    return g;
  }, [scenario, catMult, stbAdj, savings, btKeep2028, linkSegment]);

  const maxAbs = Math.max(
    ...SCEN.flatMap((s) => grid[s.key].map((d) => Math.abs(d.net))),
    1
  );

  // ---- Excel export with current setup ----
  const exportExcel = async () => {
    const r0 = (n) => Math.round(n);
    const hasStyle = typeof window !== "undefined" && window.ExcelJS;

    // ---------- assemble data as before (kept identical) ----------
    const sumRows = [
      ["HUK 3-Year P&L Simulation — Export"],
      [`Setup note: slider adjustments applied to the '${SCEN.find((s) => s.key === scenario).label}' scenario`],
      [],
      ["Net P/L (GBP)", ...YEARS],
      ...SCEN.map((s) => [s.label, ...grid[s.key].map((d) => r0(d.net))]),
      [],
      ["Net P/L (KRW)", ...YEARS],
      ...SCEN.map((s) => [s.label, ...grid[s.key].map((d) => r0(d.net * getFX()))]),
      [],
      ["Total Revenue (GBP)", ...YEARS],
      ...SCEN.map((s) => [s.label, ...grid[s.key].map((d) => r0(d.totRev))]),
      [],
      ["Gross Profit (GBP)", ...YEARS],
      ...SCEN.map((s) => [s.label, ...grid[s.key].map((d) => r0(d.gp))]),
      [],
      ["Fixed Cost (GBP)", ...YEARS],
      ...SCEN.map((s) => [s.label, ...grid[s.key].map((d) => r0(d.fixed))]),
    ];

    const scenarioSheets = SCEN.map((s) => {
      const data = YEARS.map((y) => compute(s.key, y, s.key === scenario));
      const rows = [
        [`${s.label} Scenario — 3-Year Detail`],
        [],
        ["Revenue (GBP)", ...YEARS],
        ["BT Operator", ...data.map((d) => r0(d.btRev))],
        ["STB (FHR-6000T)", ...data.map((d) => r0(d.stbRev))],
        ["EV Sales", ...data.map((d) => r0(d.evRev))],
        ["Total Revenue", ...data.map((d) => r0(d.totRev))],
        [],
        ["Gross Profit (GBP)", ...YEARS],
        ["BT (100%)", ...data.map((d) => r0(d.btRev * GM.bt))],
        ["STB (20%)", ...data.map((d) => r0(d.stbRev * GM.stb))],
        ["EV (20%)", ...data.map((d) => r0(d.evRev * GM.ev))],
        ["Total GP", ...data.map((d) => r0(d.gp))],
        [],
        ["Fixed Cost", ...data.map((d) => r0(d.fixed))],
        ["NET P/L (GBP)", ...data.map((d) => r0(d.net))],
        ["NET P/L (KRW)", ...data.map((d) => r0(d.net * getFX()))],
        [],
        ["Units", ...YEARS],
        ["STB units", ...data.map((d) => r0(d.stbU))],
        ["EV units (total)", ...data.map((d) => r0(d.evUnits))],
        [],
        ["EV units by category", ...YEARS],
        ...EV_CATEGORIES.map((c, i) => [c.label, ...data.map((d) => r0(d.catBreak[i].units))]),
        [],
        ["EV revenue by category (GBP)", ...YEARS],
        ...EV_CATEGORIES.map((c, i) => [c.label, ...data.map((d) => r0(d.catBreak[i].rev))]),
      ];
      return { label: s.label, rows };
    });

    const aRows = [
      ["Assumptions & Settings"],
      [],
      ["Pricing (GBP)", ""],
      ["EV Socket", PRICE.ev_socket],
      ["EV 5M", PRICE.ev_5m],
      ["EV 7.5M", PRICE.ev_75m],
      ["EV 22kW (MX Pro)", PRICE.ev_22kw],
      ["EV blended (50/25/25)", +evBlended().toFixed(2)],
      ["STB FHR-6000T", PRICE.stb_fhr],
      [],
      ["Gross Margin", ""],
      ["EV / STB / BT", `${GM.ev * 100}% / ${GM.stb * 100}% / ${GM.bt * 100}%`],
      ["FX (KRW/GBP)", getFX()],
      ["Base Fixed Cost", BASE_FIXED],
      [],
      ["Cost reduction applied (GBP)", ""],
      ...YEARS.map((y) => [`${y} savings`, savings[y]]),
      [],
      ["Current EV category overrides (% of BP target)", ""],
      ...EV_CATEGORIES.map((c) => [c.label, catMult[c.key] + "%"]),
      ["STB adjustment", stbAdj + "%"],
      ["BT kept in 2028", btKeep2028 ? "Yes" : "No"],
      [],
      ["EV category base (2026, units)" + (linkSegment && segBase ? " — from Segment Sim" : " — BP plan"), ""],
      ...EV_CATS.map((c) => [c.label, c.base]),
    ];

    // ---------- fallback: plain SheetJS if ExcelJS not present ----------
    if (!hasStyle) {
      const wb = XLSX.utils.book_new();
      const w1 = XLSX.utils.aoa_to_sheet(sumRows); w1["!cols"] = [{ wch: 22 }, { wch: 14 }, { wch: 14 }, { wch: 14 }];
      XLSX.utils.book_append_sheet(wb, w1, "Summary");
      scenarioSheets.forEach((sh) => { const w = XLSX.utils.aoa_to_sheet(sh.rows); w["!cols"] = [{ wch: 26 }, { wch: 14 }, { wch: 14 }, { wch: 14 }]; XLSX.utils.book_append_sheet(wb, w, sh.label); });
      const w5 = XLSX.utils.aoa_to_sheet(aRows); w5["!cols"] = [{ wch: 38 }, { wch: 16 }];
      XLSX.utils.book_append_sheet(wb, w5, "Assumptions");
      XLSX.writeFile(wb, "HUK_3Year_PL_Simulation.xlsx");
      return;
    }

    // ---------- styled workbook (ExcelJS) ----------
    const INDIGO = "FF001C3D", AZURE = "FF00B1A1", FOREST = "FF163E35", LIGHT = "FFF7FAFB", LINE = "FFDDE3EA", REDc = "FFD64545";
    const wb = new window.ExcelJS.Workbook();
    wb.creator = "HUMAX UK";

    const thin = { style: "thin", color: { argb: LINE } };
    const border = { top: thin, left: thin, bottom: thin, right: thin };

    // detect a "section header" row: text in col0, rest empty OR equals YEARS labels
    const isYearHeader = (row) => row.length > 1 && YEARS.every((y, i) => String(row[i + 1]) === String(y));
    const numFmt = '#,##0';

    const buildSheet = (name, rows, opts = {}) => {
      const ws = wb.addWorksheet(name, { views: [{ showGridLines: false }] });
      const ncol = Math.max(...rows.map((r) => r.length), 2);
      ws.columns = [{ width: opts.firstWide || 30 }, ...Array(ncol - 1).fill({ width: 16 })];

      let netBlock = null; // 'gbp' | 'krw' | null — color following data rows by sign

      rows.forEach((rowArr, idx) => {
        const r = ws.addRow(rowArr);
        const first = String(rowArr[0] || "");
        const isTitle = idx === 0;
        const headNetGBP = first === "Net P/L (GBP)";
        const headNetKRW = first === "Net P/L (KRW)";
        const lineNetGBP = /^NET P\/L \(GBP\)/.test(first);
        const lineNetKRW = /^NET P\/L \(KRW\)/.test(first);
        const isTotalLine = /^(Total Revenue|Total GP)$/.test(first);
        const yearHead = isYearHeader(rowArr);
        const subLabel = rowArr.length === 2 && rowArr[1] === "" && first;

        // update netBlock state based on this row
        if (headNetGBP) netBlock = "gbp";
        else if (headNetKRW) netBlock = "krw";
        else if (yearHead || subLabel || first === "" || /\(GBP\)|Units|Cost/.test(first)) {
          if (!lineNetGBP && !lineNetKRW) netBlock = null;
        }

        r.eachCell({ includeEmpty: false }, (cell, col) => {
          cell.font = { name: "Calibri", size: 10, color: { argb: INDIGO } };
          cell.border = border;
          if (typeof cell.value === "number") { cell.numFmt = numFmt; cell.alignment = { horizontal: "right" }; }
          else cell.alignment = { horizontal: col === 1 ? "left" : "right", vertical: "middle" };
        });

        if (isTitle) {
          ws.mergeCells(idx + 1, 1, idx + 1, ncol);
          const c = r.getCell(1);
          c.value = first;
          c.font = { name: "Calibri", size: 14, bold: true, color: { argb: "FFFFFFFF" } };
          c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: INDIGO } };
          c.alignment = { horizontal: "left", vertical: "middle" };
          r.height = 26;
          return;
        }
        if (yearHead) {
          r.eachCell((cell) => {
            cell.font = { name: "Calibri", size: 10.5, bold: true, color: { argb: "FFFFFFFF" } };
            cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: FOREST } };
            cell.alignment = { horizontal: cell.col === 1 ? "left" : "right", vertical: "middle" };
          });
          r.height = 20;
          return;
        }
        if (subLabel) {
          const c = r.getCell(1);
          c.font = { name: "Calibri", size: 10.5, bold: true, color: { argb: AZURE } };
          c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: LIGHT } };
          return;
        }
        // inline NET P/L line (per-scenario sheets) — color values by sign
        if (lineNetGBP || lineNetKRW) {
          r.eachCell((cell, col) => {
            cell.font = { name: "Calibri", size: 10, bold: true, color: { argb: col === 1 ? INDIGO : (Number(cell.value) >= 0 ? AZURE : REDc) } };
          });
          return;
        }
        // scenario data rows inside a Net P/L block (Summary sheet) — color by sign
        if (netBlock && col1IsScenario(first)) {
          r.eachCell((cell, col) => {
            cell.font = { name: "Calibri", size: 10, bold: true, color: { argb: col === 1 ? INDIGO : (Number(cell.value) >= 0 ? AZURE : REDc) } };
          });
          return;
        }
        if (isTotalLine) {
          r.eachCell((cell) => { cell.font = { name: "Calibri", size: 10, bold: true, color: { argb: INDIGO } }; });
        }
      });
      ws.views = [{ state: "frozen", ySplit: 1, showGridLines: false }];
      return ws;
    };

    const col1IsScenario = (label) => SCEN.some((s) => s.label === label);

    buildSheet("Summary", sumRows, { firstWide: 24 });
    scenarioSheets.forEach((sh) => buildSheet(sh.label, sh.rows, { firstWide: 28 }));
    buildSheet("Assumptions", aRows, { firstWide: 42 });

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "HUK_3Year_PL_Simulation.xlsx";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  return (
    <>
      <header style={S.header}>
        <div>
          <div style={S.kicker}>HUMAX UK · FINANCIAL SCENARIO LAB</div>
          <h1 style={S.h1}>3-Year P&L Simulator</h1>
          <div style={S.sub}>
            EV (category-level) · STB FHR-6000T · BT maintenance — adjust revenue & cost-reduction scenarios
          </div>
        </div>
        <div style={S.headerRight}>
          <button onClick={exportExcel} style={S.dlBtn}>
            <span style={{ fontSize: 15 }}>↓</span> Download Excel
          </button>
          <div style={S.netBadge}>
            <div style={S.netBadgeLabel}>{year} · {SCEN.find((s) => s.key === scenario).label} · Net P/L</div>
            <div style={{ ...S.netBadgeVal, color: cur.net >= 0 ? "#00B1A1" : "#d64545" }}>
              {fmtGBP(cur.net)}
            </div>
            <div style={S.netBadgeKrw}>{fmtKRW(cur.net)}</div>
          </div>
        </div>
      </header>

      {/* selectors */}
      <div style={S.selectorRow}>
        <div style={S.segGroup}>
          {SCEN.map((s) => (
            <button
              key={s.key}
              onClick={() => setScenario(s.key)}
              style={{
                ...S.seg,
                ...(scenario === s.key ? { background: s.color, color: "#fff", borderColor: s.color } : {}),
              }}
            >
              {s.label}
            </button>
          ))}
        </div>
        <div style={S.segGroup}>
          {YEARS.map((y) => (
            <button
              key={y}
              onClick={() => setYear(y)}
              style={{ ...S.seg, ...(year === y ? S.segActiveDark : {}) }}
            >
              {y}
            </button>
          ))}
        </div>
      </div>

      <div style={S.grid2}>
        {/* LEFT: revenue controls */}
        <section style={S.panel}>
          <h2 style={S.h2}>Revenue Scenario Controls</h2>
          <div style={S.panelNote}>
            Based on <b>{SCEN.find((s) => s.key === scenario).label} · {year}</b>. Sliders adjust achievement (%) vs BP target.
          </div>

          <div style={S.blockLabel}>EV — by Category (blended £{evBlended().toFixed(0)}/unit)</div>
          <div style={SIMLINK.bar}>
            <div>
              <div style={SIMLINK.title}>2026 Base ← Segment Simulation</div>
              <div style={SIMLINK.sub}>
                {segBase
                  ? (linkSegment
                      ? `Linked · 2026 base = ${Math.round(Object.values(segBase).reduce((a, b) => a + b, 0)).toLocaleString()} units from Segment Sim`
                      : "Using BP plan base. Toggle on to use Segment Sim values.")
                  : "No saved Segment Sim found — open Segment Simulation, set values, and click Save."}
              </div>
            </div>
            <button
              onClick={() => setLinkSegment((v) => !v)}
              disabled={!segBase}
              style={{ ...SIMLINK.toggle, ...(linkSegment ? SIMLINK.toggleOn : {}), ...(!segBase ? SIMLINK.toggleDisabled : {}) }}>
              {linkSegment ? "Linked" : "Link"}
            </button>
          </div>
          {cur.catBreak.map((c) => (
            <div key={c.key} style={S.sliderRow}>
              <div style={S.sliderHead}>
                <span style={S.sliderName}>{c.label}</span>
                <span style={S.sliderVal}>

// Parse the published "Monthly Tracking" CSV into dashboard data.
// Robust to the sheet's layout: category Target/Actual rows + Grand Total + branch detail.
function parseMonthlyCSV(text) {
  // simple CSV row splitter handling quoted commas
  const rows = text.split(/\r?\n/).map((line) => {
    const out = []; let cur = ""; let q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') q = !q;
      else if (ch === "," && !q) { out.push(cur); cur = ""; }
      else cur += ch;
    }
    out.push(cur);
    return out.map((s) => s.trim());
  });
  const num = (v) => { const n = parseFloat(String(v).replace(/[, ]/g, "")); return isNaN(n) ? 0 : n; };

  // EV blended price & STB price come from CONFIG
  const evP = evBlended();

  // --- category section: rows where col2 in known categories with Target/Actual in col3 ---
  // We aggregate ACTUAL monthly (cols index 3..14 = Jan..Dec) per category label (col1).
  const catActual = {}; // label -> total actual units
  let grandActualMonthly = new Array(12).fill(0);

  rows.forEach((r) => {
    const tag = (r[2] || "").toLowerCase();
    const label = r[1] || "";
    if (tag === "actual" && label && r.length >= 15) {
      const monthly = r.slice(3, 15).map(num);
      const tot = monthly.reduce((a, b) => a + b, 0);
      if (label) catActual[label] = (catActual[label] || 0) + tot;
    }
    if ((r[0] || "").toLowerCase() === "grand total" && tag === "actual") {
      grandActualMonthly = r.slice(3, 15).map(num);
    }
  });

  // --- branch detail section: consolidate channels by wholesaler name (col0) ---
  // Build map from the "Actual Sales detail" block: col0 = Wholesaler, last numeric = total
  const chan = { wholesaler: 0, distributor: 0, dealer: 0, ecommerce: 0, b2b: 0 };
  let curWholesaler = "";
  rows.forEach((r) => {
    const w = (r[0] || "").trim();
    if (w) curWholesaler = w;
    const key = (curWholesaler || "").toLowerCase();
    // total is the last non-empty numeric cell in the row (cols 3..15)
    const monthly = r.slice(3, 15).map(num);
    const tot = monthly.reduce((a, b) => a + b, 0);
    if (tot <= 0) return;
    if (key.includes("yesss") || key.includes("cef")) chan.wholesaler += tot;
    else if (key.includes("stearn") || key.includes("argos")) chan.distributor += tot;
    else if (key.includes("byd")) chan.dealer += tot;
    else if (key.includes("kelvelec")) chan.distributor += tot; // repeat acct → distributor bucket
    else if (key.includes("etc") || key.includes("charged")) chan.b2b += tot;
    else if (key.includes("ecommerce") || key.includes("online")) chan.ecommerce += tot;
  });

  const evMonthlyActual = grandActualMonthly.map((v) => (v > 0 ? v : null));
  const evUnits = grandActualMonthly.reduce((a, b) => a + b, 0);

  return {
    evMonthlyActual,
    evUnits,
    evRev: evUnits * evP,
    categories: [
      { label: "Wholesaler (Yesss, CEF)", actual: chan.wholesaler, target: 4819 },
      { label: "Distributor (Stearn, Argos)", actual: chan.distributor, target: 600 },
      { label: "Dealer Group (BYD Harmony, CG)", actual: chan.dealer, target: 1400 },
      { label: "eCommerce", actual: chan.ecommerce, target: 272 },
      { label: "B2B (ChargedEV)", actual: chan.b2b, target: 3705 },
    ],
  };
}

// ============================================================
//  PO ORDER-MASTER PARSER (Simon / Mudassar / B2B Sales tabs)
//  Parses Confirmed PO rows → Wholesaler → Branch → month/week qty & revenue
// ============================================================
const PO_SKU_PRICE = { socket: 369, c5m: 379, c75m: 396, mx22: 579 };
const PO_MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

function splitCSVLine(line) {
  const out = []; let cur = ""; let q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') q = !q;
    else if (ch === "," && !q) { out.push(cur); cur = ""; }
    else cur += ch;
  }
  out.push(cur);
  return out.map((s) => s.trim());
}

// Parse all order-master sections from the full published CSV text.
// Auto-detects each section by its header row, handles Simon/Mudassar (19-col) and B2B (17-col) layouts.
function parsePOOrders(text) {
  const numv = (v) => { const n = parseFloat(String(v).replace(/[, ]/g, "")); return isNaN(n) ? 0 : n; };
  const lines = text.split(/\r?\n/);
  const rows = lines.map(splitCSVLine);

  const recs = [];
  let layout = null; // current column layout

  rows.forEach((r) => {
    const c0 = (r[0] || "").trim();
    // detect header rows
    if (c0 === "Status" && r.includes("Model")) {
      const wholeIdx = r.findIndex((x) => /Wholesaler|Dist/i.test(x));
      const custIdx = r.findIndex((x) => /Customer/i.test(x));
      const branchIdx = r.findIndex((x) => /Branch/i.test(x));
      const monthIdx = r.findIndex((x) => /Target Month/i.test(x));
      const weekIdx = r.findIndex((x) => /Week/i.test(x));
      // MX22 column index (SKU). Socket=2,5m=3,7.5m=4 standard
      const mx22Idx = r.findIndex((x) => /^MX22$/i.test(x));
      layout = {
        socket: 2, c5m: 3, c75m: 4,
        mx22: mx22Idx >= 0 ? mx22Idx : 7,
        branch: branchIdx >= 0 ? branchIdx : 12,
        whole: wholeIdx >= 0 ? wholeIdx : (custIdx >= 0 ? custIdx : 13),
        month: monthIdx >= 0 ? monthIdx : 15,
        week: weekIdx >= 0 ? weekIdx : 16,
        // for B2B, "BYD Branch" is branch and "Customer" is wholesaler/account
        custIdx,
      };
      return;
    }
    if (!layout) return;
    if (c0 !== "Confirmed PO") return;

    const socket = numv(r[layout.socket]), c5 = numv(r[layout.c5m]), c75 = numv(r[layout.c75m]), mx22 = numv(r[layout.mx22]);
    const qty = socket + c5 + c75 + mx22;
    if (qty <= 0) return;

    // Wholesaler / account name. For B2B the "Customer" column (BYD Harmony / Other / eCommerce) is the account.
    let whole = (r[layout.whole] || "").trim();
    let branch = (r[layout.branch] || "").trim();
    if (!whole) whole = branch || "Other";
    if (!branch) branch = whole;

    const month = (r[layout.month] || "").trim();
    const week = numv(r[layout.week]);
    const rev = socket * PO_SKU_PRICE.socket + c5 * PO_SKU_PRICE.c5m + c75 * PO_SKU_PRICE.c75m + mx22 * PO_SKU_PRICE.mx22;
    recs.push({ whole, branch, month, week, socket, c5, c75, mx22, qty, rev });
  });
  return recs;
}

// Aggregate records into Wholesaler → Branch → per-month/week structure
function aggregatePO(recs, mode /* 'month' | 'week' */) {
  const cols = mode === "week"
    ? Array.from({ length: 53 }, (_, i) => i + 1)   // WK1..53
    : PO_MONTHS;
  const keyOf = (rec) => mode === "week" ? rec.week : rec.month;

  const wholeMap = {};
  recs.forEach((rec) => {
    const wKey = rec.whole;
    if (!wholeMap[wKey]) wholeMap[wKey] = { name: wKey, branches: {}, qty: 0, rev: 0, byCol: {} };
    const w = wholeMap[wKey];
    if (!w.branches[rec.branch]) w.branches[rec.branch] = { name: rec.branch, qty: 0, rev: 0, byCol: {} };
    const b = w.branches[rec.branch];
    const k = keyOf(rec);
    b.byCol[k] = (b.byCol[k] || 0) + rec.qty;
    w.byCol[k] = (w.byCol[k] || 0) + rec.qty;
    b.qty += rec.qty; b.rev += rec.rev;
    w.qty += rec.qty; w.rev += rec.rev;
  });

  const wholesalers = Object.values(wholeMap)
    .map((w) => ({ ...w, branches: Object.values(w.branches).sort((a, b) => b.qty - a.qty) }))
    .sort((a, b) => b.qty - a.qty);

  // active columns only (drop all-zero months/weeks)
  const activeCols = cols.filter((c) => wholesalers.some((w) => (w.byCol[c] || 0) > 0));
  const totals = { byCol: {}, qty: 0, rev: 0 };
  wholesalers.forEach((w) => {
    activeCols.forEach((c) => (totals.byCol[c] = (totals.byCol[c] || 0) + (w.byCol[c] || 0)));
    totals.qty += w.qty; totals.rev += w.rev;
  });
  return { wholesalers, activeCols, totals };
}

const LIVE = {
  urls: { monthly: "", simon: "", mudassar: "", b2b: "" },
  data: null,      // parsed Monthly Tracking
  poRecs: null,    // combined Confirmed PO records
  status: "",
};

async function loadLiveData(onDone) {
  const fetchText = async (url) => {
    if (!url || !url.trim()) return null;
    const res = await fetch(url.trim());
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.text();
  };
  const u = LIVE.urls;
  const anyUrl = u.monthly || u.simon || u.mudassar || u.b2b;
  if (!anyUrl) { LIVE.status = "Enter at least one published CSV link in Settings."; onDone && onDone(); return; }
  LIVE.status = "Loading…"; onDone && onDone();
  try {
    let monthlyOk = false;
    if (u.monthly) {
      const t = await fetchText(u.monthly);
      if (t) { LIVE.data = parseMonthlyCSV(t); monthlyOk = true; }
    }
    const poTexts = [];
    for (const k of ["simon", "mudassar", "b2b"]) {
      try { const t = await fetchText(u[k]); if (t) poTexts.push(t); } catch (e) {}
    }
    let allRecs = [];
    poTexts.forEach((t) => { try { allRecs = allRecs.concat(parsePOOrders(t)); } catch (e) {} });
    if (allRecs.length === 0 && u.monthly) {
      try { const t = await fetchText(u.monthly); if (t) allRecs = parsePOOrders(t); } catch (e) {}
    }
    LIVE.poRecs = allRecs.length ? allRecs : null;
    const parts = [];
    if (monthlyOk) parts.push("KPIs");
    if (allRecs.length) parts.push(`${allRecs.length} PO rows`);
    LIVE.status = (parts.length ? "Connected (" + parts.join(" · ") + ")" : "Connected") + " · " + new Date().toLocaleTimeString();
  } catch (e) {
    LIVE.status = "Could not load — check links are published CSV (…/pub?…output=csv).";
  }
  onDone && onDone();
}

function SegmentSim() {
  // --- load any previously saved snapshot (works on hosted site; ignored if storage blocked) ---
  const loadSaved = () => {
    try {
      const raw = window.localStorage.getItem("huk_segment_sim");
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  };
  const saved = loadSaved();

  const [rr, setRr] = useState(() =>
    (saved && saved.rr) ? saved.rr : Object.fromEntries(SEG_BASE.map((s) => [s.key, s.runRate]))

  const [pipe, setPipe] = useState(() =>

  const [saveMsg, setSaveMsg] = useState("");

  const saveSnapshot = () => {
    try {
      window.localStorage.setItem("huk_segment_sim", JSON.stringify({ rr, pipe, nid }));
      setSaveMsg("Saved · " + new Date().toLocaleTimeString());
    } catch (e) {
      setSaveMsg("Could not save (storage blocked in preview — works on hosted site)");
    }
  };
  const resetSnapshot = () => {
    try { window.localStorage.removeItem("huk_segment_sim"); } catch (e) {}
    setRr(Object.fromEntries(SEG_BASE.map((s) => [s.key, s.runRate])));
    setPipe([
      { id: 1, name: "BYD (additional dealers)", type: "Dealer", monthly: 20, startMonth: 7, product: "MX7" },
      { id: 2, name: "Fleet pilot", type: "Fleet Manager", monthly: 10, startMonth: 8, product: "MX7" },

    });
    const pipeTotals = pipe.map((c) => {

        </div>
        <div style={D.kpi}>
          <div style={D.kpiLabel}>Avg Monthly (H2)</div>
          <div style={{ ...D.kpiVal, color: HX.indigo }}>{Math.round(calc.monthlyUnits.slice(6).reduce((a, b) => a + b, 0) / 6).toLocaleString()}</div>
          <div style={D.kpiSub}>units / month (Jul–Dec)</div>
        </div>

function Settings({ onChange }) {
  const [, force] = useState(0);
  const set = (path, v) => {
    const num = v === "" ? 0 : +v;
    const [grp, key] = path.split(".");
    CONFIG[grp][key] = num;
    force((x) => x + 1);
    onChange && onChange();
  };

  const priceRows = [
    ["MX7 Socket", "price.ev_socket"],
    ["MX7 5M", "price.ev_5m"],
    ["MX7 7.5M", "price.ev_75m"],
    ["MX Pro 22kW (MX22)", "price.ev_22kw"],
    ["STB FHR-6000T", "price.stb_fhr"],
  ];
  const mixRows = [
    ["Socket weight", "mix.socket"],
    ["5M weight", "mix.c5m"],
    ["7.5M weight", "mix.c75m"],
  ];
  const gmRows = [
    ["EV", "gm.ev"],
    ["STB", "gm.stb"],
    ["BT", "gm.bt"],
  ];
  const mixSum = CONFIG.mix.socket + CONFIG.mix.c5m + CONFIG.mix.c75m;

  const Field = ({ label, path, step, suffix, prefix }) => {
    const [grp, key] = path.split(".");
    return (
      <div style={ST.field}>
        <label style={ST.fieldLabel}>{label}</label>
        <div style={ST.inputWrap}>
          {prefix && <span style={ST.affix}>{prefix}</span>}
          <input type="number" step={step || "0.01"} value={CONFIG[grp][key]}
            onChange={(e) => set(path, e.target.value)} style={ST.input} />
          {suffix && <span style={ST.affix}>{suffix}</span>}
        </div>
      </div>
    );
  };

  return (
    <div>
      <div style={ST.banner}>
        These values are the single source of truth. Editing them updates the Dashboard, Segment Simulation, and 3-Year Simulator instantly.
      </div>

      <div style={D.grid2}>
        <section style={S.panel}>
          <h2 style={S.h2}>Model Prices (GBP)</h2>
          <div style={S.panelNote}>Per-unit selling price by model.</div>
          {priceRows.map(([l, p]) => <Field key={p} label={l} path={p} prefix="£" step="0.01" />)}
          <div style={{ ...S.catTotal, marginTop: 16 }}>
            <span style={S.catTotalLabel}>EV Home Blended</span>
            <span style={S.catTotalVal}>£{evBlended().toFixed(2)}/unit</span>
          </div>
        </section>

        <section style={S.panel}>
          <h2 style={S.h2}>Margin Rate & FX</h2>
          <div style={S.panelNote}>Gross margin by line and KRW/GBP exchange rate.</div>
          <div style={S.blockLabel}>Gross Margin (%)</div>
          {gmRows.map(([l, p]) => {
            const [grp, key] = p.split(".");
            return (
              <div key={p} style={ST.field}>
                <label style={ST.fieldLabel}>{l}</label>
                <div style={ST.inputWrap}>
                  <input type="number" step="1" value={+(CONFIG[grp][key] * 100).toFixed(1)}
                    onChange={(e) => { CONFIG[grp][key] = (e.target.value === "" ? 0 : +e.target.value) / 100; force((x) => x + 1); onChange && onChange(); }}
                    style={ST.input} />
                  <span style={ST.affix}>%</span>
                </div>
              </div>
            );
          })}
          <div style={{ ...S.blockLabel, marginTop: 16 }}>Exchange Rate</div>
          <div style={ST.field}>
            <label style={ST.fieldLabel}>KRW per GBP</label>
            <div style={ST.inputWrap}>
              <span style={ST.affix}>₩</span>
              <input type="number" step="0.001" value={CONFIG.fx}
                onChange={(e) => { CONFIG.fx = e.target.value === "" ? 0 : +e.target.value; force((x) => x + 1); onChange && onChange(); }}
                style={ST.input} />
            </div>
          </div>

          <div style={{ ...S.blockLabel, marginTop: 16 }}>EV Home Mix Weights</div>
          <div style={S.panelNote}>How MX7 sales split across variants (used for the blended EV price). Sum: {(mixSum * 100).toFixed(0)}%{Math.abs(mixSum - 1) > 0.001 ? " ⚠ should be 100%" : " ✓"}</div>
          {mixRows.map(([l, p]) => <Field key={p} label={l} path={p} step="0.05" suffix="" />)}
        </section>
      </div>

      <section style={S.panel}>
        <div style={DL.panelHead}>
          <div style={DL.connInfo}>
            <span style={DL.connDot(LIVE.data || LIVE.poRecs)} />
            <h2 style={{ ...S.h2, margin: 0 }}>Google Sheet Live Link</h2>
          </div>
          <div style={DL.btns}>
            <button style={DL.connBtn} onClick={() => loadLiveData(() => { force((x) => x + 1); onChange && onChange(); })}>Connect</button>
            <button style={DL.connBtnGhost} onClick={() => loadLiveData(() => { force((x) => x + 1); onChange && onChange(); })} title="Refresh">↻</button>
          </div>
        </div>
        <div style={S.panelNote}>{LIVE.status || "Paste each tab's published CSV link (…/pub?gid=…&output=csv), then Connect. Data appears on the Sales Dashboard."}</div>
        <div style={DL.inputGrid}>
          <label style={DL.inLabel}>Monthly Tracking
            <input style={DL.connInput} placeholder="…/pub?gid=…&output=csv (KPIs & charts)"
              defaultValue={LIVE.urls.monthly} onChange={(e) => { LIVE.urls.monthly = e.target.value; }} />
          </label>
          <label style={DL.inLabel}>Simon — Order Master
            <input style={DL.connInput} placeholder="…/pub?gid=…&output=csv (PO detail)"
              defaultValue={LIVE.urls.simon} onChange={(e) => { LIVE.urls.simon = e.target.value; }} />
          </label>
          <label style={DL.inLabel}>Mudassar — Order Master
            <input style={DL.connInput} placeholder="…/pub?gid=…&output=csv (PO detail)"
              defaultValue={LIVE.urls.mudassar} onChange={(e) => { LIVE.urls.mudassar = e.target.value; }} />
          </label>
          <label style={DL.inLabel}>B2B — Order Master
            <input style={DL.connInput} placeholder="…/pub?gid=…&output=csv (PO detail)"
              defaultValue={LIVE.urls.b2b} onChange={(e) => { LIVE.urls.b2b = e.target.value; }} />
          </label>
        </div>
        <div style={DL.hint}>Monthly Tracking drives the Dashboard KPIs &amp; charts; the three Order Master tabs feed the Sales by Channel table. Leave any blank to skip. File must be a Google Sheet (not .xlsx) and each tab Published to web as CSV.</div>
      </section>

      <section style={S.panel}>
        <h2 style={S.h2}>Current Effective Values</h2>
        <div style={ST.summaryGrid}>
          <div style={ST.sumCard}><div style={ST.sumLabel}>EV Blended</div><div style={ST.sumVal}>£{evBlended().toFixed(2)}</div></div>
          <div style={ST.sumCard}><div style={ST.sumLabel}>MX22 / Commercial</div><div style={ST.sumVal}>£{PRICE.ev_22kw.toFixed(0)}</div></div>
          <div style={ST.sumCard}><div style={ST.sumLabel}>STB</div><div style={ST.sumVal}>£{PRICE.stb_fhr.toFixed(0)}</div></div>
          <div style={ST.sumCard}><div style={ST.sumLabel}>EV / STB / BT GM</div><div style={ST.sumVal}>{(GM.ev*100).toFixed(0)}/{(GM.stb*100).toFixed(0)}/{(GM.bt*100).toFixed(0)}%</div></div>
          <div style={ST.sumCard}><div style={ST.sumLabel}>FX</div><div style={ST.sumVal}>₩{getFX().toLocaleString()}</div></div>
        </div>
        <div style={S.footNote}>
          Changes apply immediately across all tabs for this session. Reload restores defaults (MX7 Socket £332.14 / 5M £342.37 / 7.5M £357.73 · MX22 £579 · STB £153 · GM 20/20/100% · FX 1810.195).
        </div>
      </section>
    </div>
  );
}
