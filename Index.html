<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HUMAX UK — Revenue & Scenario Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>html,body{margin:0;padding:0;background:#f5f7fa;}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;

// ============================================================
//  HUK 3-Year P&L Simulator
//  EV (category-level) + STB (FHR-6000T) + BT maintenance
//  Adjustable revenue scenarios & cost-reduction levers
// ============================================================

// ---- Central configuration (editable in Settings; referenced by all pages) ----
// Mutable in-memory store. Settings page updates these; pages re-read on each render.
const CONFIG = {
  price: {
    ev_socket: 332.14,
    ev_5m: 342.37,
    ev_75m: 357.73,
    ev_22kw: 579.0,
    stb_fhr: 153.0,
  },
  // EV home blended mix weights (must sum to 1)
  mix: { socket: 0.5, c5m: 0.25, c75m: 0.25 },
  gm: { ev: 0.2, stb: 0.2, bt: 1.0 }, // gross margins
  fx: 1810.195, // KRW per GBP
};
// Back-compat references used throughout the app:
const PRICE = CONFIG.price;          // object ref — mutating properties is reflected everywhere
const GM = CONFIG.gm;                // object ref
const getFX = () => CONFIG.fx;       // FX can change, so read via function
const evBlended = () =>
  CONFIG.mix.socket * PRICE.ev_socket + CONFIG.mix.c5m * PRICE.ev_5m + CONFIG.mix.c75m * PRICE.ev_75m;
const prodPrice = (key) => (key === "MX22" ? PRICE.ev_22kw : evBlended());

// ---- EV categories: 2026 BP annual target (from Monthly Tracking) ----
// baseUnits = 2026 plan; we scale per scenario & per year
const EV_CATEGORIES = [
  { key: "wholesaler", label: "Wholesaler", base: 4220, note: "Yesss·CEF wholesale channel" },
  { key: "distributor", label: "Distributor", base: 600, note: "Stearn and mid-tier distribution" },
  { key: "ecommerce", label: "eCommerce", base: 272, note: "Argos·Online" },
  { key: "dealer", label: "Dealer", base: 1400, note: "BYD and dealerships" },
  { key: "fleet", label: "Fleet", base: 1500, note: "B2B Home/Commercial Fleet" },
  { key: "cpo", label: "CPO", base: 805, note: "Commercial B2B / CPO" },
];

// scenario multipliers vs BP target (Worst/Base/Best), per year
// 2026 anchored to realistic run-rate (Worst ≈ current pace), grows in 27/28
const SCENARIO_MULT = {
  worst: { 2026: 0.08, 2027: 0.16, 2028: 0.24 },
  base: { 2026: 0.14, 2027: 0.25, 2028: 0.40 },
  best: { 2026: 0.24, 2027: 0.40, 2028: 0.62 },
};

// STB FHR-6000T units by scenario (2026 BP = 20,280). Declines after.
const STB_UNITS = {
  worst: { 2026: 14196, 2027: 9000, 2028: 4500 },
  base: { 2026: 17238, 2027: 12000, 2028: 7000 },
  best: { 2026: 20280, 2027: 16000, 2028: 11000 },
};

// BT maintenance: £700k through 2027, removed 2028
const BT_REV = { 2026: 700000, 2027: 700000, 2028: 0 };

// Base fixed-cost budget (Jeff PL) & 2026 actual budget
const BASE_FIXED = 2154193;

const YEARS = [2026, 2027, 2028];
const SCEN = [
  { key: "worst", label: "Worst", color: "#d64545" },
  { key: "base", label: "Base", color: "#00B1A1" },
  { key: "best", label: "Best", color: "#163E35" },
];

const fmtGBP = (n) =>
  (n < 0 ? "−£" : "£") + Math.abs(Math.round(n)).toLocaleString();
const fmtM = (n) => (n < 0 ? "−£" : "£") + (Math.abs(n) / 1e6).toFixed(2) + "M";
const fmtKRW = (n) =>
  (n < 0 ? "−₩" : "₩") + Math.abs(Math.round(n * getFX())).toLocaleString();
const r0k = (n) => Math.round(n).toLocaleString();

function Simulator() {
  const [scenario, setScenario] = useState("base");
  const [year, setYear] = useState(2026);

  // EV category multiplier overrides (per category, % of BP target)
  const [catMult, setCatMult] = useState(() =>
    Object.fromEntries(EV_CATEGORIES.map((c) => [c.key, 100]))
  );
  // STB unit override (% of scenario default)
  const [stbAdj, setStbAdj] = useState(100);
  // Cost reduction lever (£ saved off fixed cost), applied from 2027
  const [savings, setSavings] = useState({ 2026: 0, 2027: 687000, 2028: 687000 });
  const [btKeep2028, setBtKeep2028] = useState(false);

  const setCat = (k, v) => setCatMult((p) => ({ ...p, [k]: v }));

  // ---- compute one year/scenario ----
  const compute = (sc, yr, useOverrides) => {
    const mult = SCENARIO_MULT[sc][yr];
    // EV revenue by category
    let evUnits = 0;
    const catBreak = EV_CATEGORIES.map((c) => {
      const ov = useOverrides ? catMult[c.key] / 100 : 1;
      const u = c.base * mult * ov;
      evUnits += u;
      return { ...c, units: u, rev: u * evBlended() };
    });
    const evRev = evUnits * evBlended();
    // STB
    const stbBase = STB_UNITS[sc][yr];
    const stbU = stbBase * (useOverrides ? stbAdj / 100 : 1);
    const stbRev = stbU * PRICE.stb_fhr;
    // BT
    let btRev = BT_REV[yr];
    if (yr === 2028 && btKeep2028) btRev = 700000;
    // GP
    const gp = evRev * GM.ev + stbRev * GM.stb + btRev * GM.bt;
    const totRev = evRev + stbRev + btRev;
    const fixed = BASE_FIXED - (useOverrides ? savings[yr] : 0);
    const net = gp - fixed;
    return { evUnits, evRev, catBreak, stbU, stbRev, btRev, gp, totRev, fixed, net };
  };

  const cur = useMemo(() => compute(scenario, year, true), [scenario, year, catMult, stbAdj, savings, btKeep2028]);

  // 3-year x 3-scenario grid (with overrides applied to chosen scenario only? -> apply globally for comparison)
  const grid = useMemo(() => {
    const g = {};
    SCEN.forEach((s) => {
      g[s.key] = YEARS.map((y) => compute(s.key, y, s.key === scenario));
    });
    return g;
  }, [scenario, catMult, stbAdj, savings, btKeep2028]);

  const maxAbs = Math.max(
    ...SCEN.flatMap((s) => grid[s.key].map((d) => Math.abs(d.net))),
    1
  );

  // ---- Excel export with current setup ----
  const exportExcel = () => {
    const wb = XLSX.utils.book_new();
    const r0 = (n) => Math.round(n);

    // Sheet 1: Summary (3yr x 3scenario Net P/L)
    const sumRows = [
      ["HUK 3-Year P&L Simulation — Export"],
      [`Setup note: slider adjustments applied to the '${SCEN.find((s) => s.key === scenario).label}' scenario`],
      [],
      ["Net P/L (GBP)", ...YEARS],
      ...SCEN.map((s) => [s.label, ...grid[s.key].map((d) => r0(d.net))]),
      [],
      ["Net P/L (KRW)", ...YEARS],
      ...SCEN.map((s) => [s.label, ...grid[s.key].map((d) => r0(d.net * getFX()))]),
      [],
      ["Total Revenue (GBP)", ...YEARS],
      ...SCEN.map((s) => [s.label, ...grid[s.key].map((d) => r0(d.totRev))]),
      [],
      ["Gross Profit (GBP)", ...YEARS],
      ...SCEN.map((s) => [s.label, ...grid[s.key].map((d) => r0(d.gp))]),
      [],
      ["Fixed Cost (GBP)", ...YEARS],
      ...SCEN.map((s) => [s.label, ...grid[s.key].map((d) => r0(d.fixed))]),
    ];
    const ws1 = XLSX.utils.aoa_to_sheet(sumRows);
    ws1["!cols"] = [{ wch: 22 }, { wch: 14 }, { wch: 14 }, { wch: 14 }];
    XLSX.utils.book_append_sheet(wb, ws1, "Summary");

    // Sheet 2-4: per-scenario detailed breakdown (revenue lines + EV categories)
    SCEN.forEach((s) => {
      const data = YEARS.map((y) => compute(s.key, y, s.key === scenario));
      const rows = [
        [`${s.label} Scenario — 3-Year Detail`],
        [],
        ["Revenue (GBP)", ...YEARS],
        ["BT Operator", ...data.map((d) => r0(d.btRev))],
        ["STB (FHR-6000T)", ...data.map((d) => r0(d.stbRev))],
        ["EV Sales", ...data.map((d) => r0(d.evRev))],
        ["Total Revenue", ...data.map((d) => r0(d.totRev))],
        [],
        ["Gross Profit (GBP)", ...YEARS],
        ["BT (100%)", ...data.map((d) => r0(d.btRev * GM.bt))],
        ["STB (20%)", ...data.map((d) => r0(d.stbRev * GM.stb))],
        ["EV (20%)", ...data.map((d) => r0(d.evRev * GM.ev))],
        ["Total GP", ...data.map((d) => r0(d.gp))],
        [],
        ["Fixed Cost", ...data.map((d) => r0(d.fixed))],
        ["NET P/L (GBP)", ...data.map((d) => r0(d.net))],
        ["NET P/L (KRW)", ...data.map((d) => r0(d.net * getFX()))],
        [],
        ["Units", ...YEARS],
        ["STB units", ...data.map((d) => r0(d.stbU))],
        ["EV units (total)", ...data.map((d) => r0(d.evUnits))],
        [],
        ["EV units by category", ...YEARS],
        ...EV_CATEGORIES.map((c, i) => [
          c.label,
          ...data.map((d) => r0(d.catBreak[i].units)),
        ]),
        [],
        ["EV revenue by category (GBP)", ...YEARS],
        ...EV_CATEGORIES.map((c, i) => [
          c.label,
          ...data.map((d) => r0(d.catBreak[i].rev)),
        ]),
      ];
      const ws = XLSX.utils.aoa_to_sheet(rows);
      ws["!cols"] = [{ wch: 26 }, { wch: 14 }, { wch: 14 }, { wch: 14 }];
      XLSX.utils.book_append_sheet(wb, ws, s.label);
    });

    // Sheet 5: Assumptions
    const aRows = [
      ["Assumptions & Settings"],
      [],
      ["Pricing (GBP)", ""],
      ["EV Socket", PRICE.ev_socket],
      ["EV 5M", PRICE.ev_5m],
      ["EV 7.5M", PRICE.ev_75m],
      ["EV 22kW (MX Pro)", PRICE.ev_22kw],
      ["EV blended (50/25/25)", +evBlended().toFixed(2)],
      ["STB FHR-6000T", PRICE.stb_fhr],
      [],
      ["Gross Margin", ""],
      ["EV / STB / BT", `${GM.ev * 100}% / ${GM.stb * 100}% / ${GM.bt * 100}%`],
      ["FX (KRW/GBP)", getFX()],
      ["Base Fixed Cost", BASE_FIXED],
      [],
      ["Cost reduction applied (GBP)", ""],
      ...YEARS.map((y) => [`${y} savings`, savings[y]]),
      [],
      ["Current EV category overrides (% of BP target)", ""],
      ...EV_CATEGORIES.map((c) => [c.label, catMult[c.key] + "%"]),
      ["STB adjustment", stbAdj + "%"],
      ["BT kept in 2028", btKeep2028 ? "Yes" : "No"],
      [],
      ["EV category BP target (2026, units)", ""],
      ...EV_CATEGORIES.map((c) => [c.label, c.base]),
    ];
    const ws5 = XLSX.utils.aoa_to_sheet(aRows);
    ws5["!cols"] = [{ wch: 38 }, { wch: 16 }];
    XLSX.utils.book_append_sheet(wb, ws5, "Assumptions");

    XLSX.writeFile(wb, "HUK_3Year_PL_Simulation.xlsx");
  };

  return (
    <>
      <header style={S.header}>
        <div>
          <div style={S.kicker}>HUMAX UK · FINANCIAL SCENARIO LAB</div>
          <h1 style={S.h1}>3-Year P&L Simulator</h1>
          <div style={S.sub}>
            EV (category-level) · STB FHR-6000T · BT maintenance — adjust revenue & cost-reduction scenarios
          </div>
        </div>
        <div style={S.headerRight}>
          <button onClick={exportExcel} style={S.dlBtn}>
            <span style={{ fontSize: 15 }}>↓</span> Download Excel
          </button>
          <div style={S.netBadge}>
            <div style={S.netBadgeLabel}>{year} · {SCEN.find((s) => s.key === scenario).label} · Net P/L</div>
            <div style={{ ...S.netBadgeVal, color: cur.net >= 0 ? "#00B1A1" : "#d64545" }}>
              {fmtGBP(cur.net)}
            </div>
            <div style={S.netBadgeKrw}>{fmtKRW(cur.net)}</div>
          </div>
        </div>
      </header>

      {/* selectors */}
      <div style={S.selectorRow}>
        <div style={S.segGroup}>
          {SCEN.map((s) => (
            <button
              key={s.key}
              onClick={() => setScenario(s.key)}
              style={{
                ...S.seg,
                ...(scenario === s.key ? { background: s.color, color: "#fff", borderColor: s.color } : {}),
              }}
            >
              {s.label}
            </button>
          ))}
        </div>
        <div style={S.segGroup}>
          {YEARS.map((y) => (
            <button
              key={y}
              onClick={() => setYear(y)}
              style={{ ...S.seg, ...(year === y ? S.segActiveDark : {}) }}
            >
              {y}
            </button>
          ))}
        </div>
      </div>

      <div style={S.grid2}>
        {/* LEFT: revenue controls */}
        <section style={S.panel}>
          <h2 style={S.h2}>Revenue Scenario Controls</h2>
          <div style={S.panelNote}>
            Based on <b>{SCEN.find((s) => s.key === scenario).label} · {year}</b>. Sliders adjust achievement (%) vs BP target.
          </div>

          <div style={S.blockLabel}>EV — by Category (blended £{evBlended().toFixed(0)}/unit)</div>
          {cur.catBreak.map((c) => (
            <div key={c.key} style={S.sliderRow}>
              <div style={S.sliderHead}>
                <span style={S.sliderName}>{c.label}</span>
                <span style={S.sliderVal}>
                  {Math.round(c.units).toLocaleString()} units · {fmtGBP(c.rev)}
                </span>
              </div>
              <input
                type="range" min="0" max="200" value={catMult[c.key]}
                onChange={(e) => setCat(c.key, +e.target.value)}
                style={S.range}
              />
              <div style={S.sliderSub}>{c.note} · {catMult[c.key]}%</div>
            </div>
          ))}
          <div style={S.catTotal}>
            <span style={S.catTotalLabel}>EV Total</span>
            <span style={S.catTotalVal}>
              {Math.round(cur.evUnits).toLocaleString()} units · {fmtGBP(cur.evRev)}
              <span style={S.catTotalGp}> (GP {fmtGBP(cur.evRev * GM.ev)})</span>
            </span>
          </div>

          <div style={{ ...S.blockLabel, marginTop: 18 }}>STB — FHR-6000T (£{PRICE.stb_fhr}/unit)</div>
          <div style={S.sliderRow}>
            <div style={S.sliderHead}>
              <span style={S.sliderName}>FHR-6000T</span>
              <span style={S.sliderVal}>{Math.round(cur.stbU).toLocaleString()} units · {fmtGBP(cur.stbRev)}</span>
            </div>
            <input type="range" min="0" max="150" value={stbAdj}
              onChange={(e) => setStbAdj(+e.target.value)} style={S.range} />
            <div style={S.sliderSub}>{stbAdj}% of scenario default</div>
          </div>

          <div style={{ ...S.blockLabel, marginTop: 18 }}>BT Maintenance</div>
          <div style={S.btRow}>
            <span style={S.sliderName}>{cur.btRev > 0 ? fmtGBP(cur.btRev) : "Removed (£0)"}</span>
            {year === 2028 && (
              <label style={S.checkLabel}>
                <input type="checkbox" checked={btKeep2028}
                  onChange={(e) => setBtKeep2028(e.target.checked)} />
                Keep BT in 2028
              </label>
            )}
            {year !== 2028 && <span style={S.sliderSub}>£700k through 2027 · removed in 2028</span>}
          </div>
        </section>

        {/* RIGHT: cost + result */}
        <section style={S.panel}>
          <h2 style={S.h2}>Cost Reduction & P&L</h2>
          <div style={S.blockLabel}>Fixed-Cost Savings (by year, £)</div>
          {YEARS.map((y) => (
            <div key={y} style={S.sliderRow}>
              <div style={S.sliderHead}>
                <span style={S.sliderName}>{y} savings</span>
                <span style={S.sliderVal}>{fmtGBP(savings[y])}</span>
              </div>
              <input type="range" min="0" max="1000000" step="1000" value={savings[y]}
                onChange={(e) => setSavings((p) => ({ ...p, [y]: +e.target.value }))}
                style={S.range} />
              <div style={S.sliderSub}>
                Adjusted fixed cost {fmtGBP(BASE_FIXED - savings[y])} · {((savings[y] / BASE_FIXED) * 100).toFixed(1)}% reduction
              </div>
            </div>
          ))}

          {/* P&L waterfall for current selection */}
          <div style={S.plBox}>
            <div style={S.plTitle}>{year} · {SCEN.find((s) => s.key === scenario).label} P&L</div>
            {[
              ["BT Operator", cur.btRev, cur.btRev * GM.bt],
              ["STB (FHR-6000T)", cur.stbRev, cur.stbRev * GM.stb],
              ["EV Sales", cur.evRev, cur.evRev * GM.ev],
            ].map(([l, rev, gp]) => (
              <div key={l} style={S.plRow}>
                <span>{l}</span>
                <span style={S.plRev}>{fmtM(rev)}</span>
                <span style={S.plGp}>GP {fmtM(gp)}</span>
              </div>
            ))}
            <div style={{ ...S.plRow, ...S.plSub }}>
              <span>Total Revenue</span>
              <span style={S.plRev}>{fmtM(cur.totRev)}</span>
              <span style={S.plGp}>GP {fmtM(cur.gp)}</span>
            </div>
            <div style={{ ...S.plRow, color: "#777" }}>
              <span>Fixed Cost</span>
              <span></span>
              <span style={S.plGp}>−{fmtM(cur.fixed)}</span>
            </div>
            <div style={{ ...S.plRow, ...S.plNet, color: cur.net >= 0 ? "#00B1A1" : "#d64545" }}>
              <span>Net P/L</span>
              <span></span>
              <span style={S.plGp}>{fmtGBP(cur.net)}</span>
            </div>
          </div>
        </section>
      </div>

      {/* 3yr x 3scenario matrix */}
      <section style={S.panel}>
        <h2 style={S.h2}>3-Year × Scenario — Net P/L · Units · Revenue · Margin</h2>
        <div style={S.matrix}>
          <div style={S.matrixHead}></div>
          {YEARS.map((y) => <div key={y} style={S.matrixHead}>{y}</div>)}
          {SCEN.map((s) => (
            <React.Fragment key={s.key}>
              <div style={{ ...S.matrixRowLabel, color: s.color }}>{s.label}</div>
              {grid[s.key].map((d, i) => (
                <div key={i} style={S.matrixCell}>
                  <div style={S.barWrap}>
                    <div style={{
                      ...S.bar,
                      width: `${(Math.abs(d.net) / maxAbs) * 100}%`,
                      background: d.net >= 0 ? "#00B1A1" : "#d64545",
                      marginLeft: d.net >= 0 ? "50%" : `${50 - (Math.abs(d.net) / maxAbs) * 50}%`,
                    }} />
                    <div style={S.barAxis} />
                  </div>
                  <div style={{ ...S.matrixVal, color: d.net >= 0 ? "#00B1A1" : "#d64545" }}>
                    {fmtGBP(d.net)}
                  </div>
                  <div style={S.matrixMeta}>
                    <div style={S.metaLine}><span>Units</span><span>{r0k(d.evUnits + d.stbU)}</span></div>
                    <div style={S.metaLine}><span>Revenue</span><span>{fmtM(d.totRev)}</span></div>
                    <div style={S.metaLine}><span>Margin</span><span>{fmtM(d.gp)}</span></div>
                  </div>
                </div>
              ))}
            </React.Fragment>
          ))}
        </div>
        <div style={S.footNote}>
          Note: slider adjustments apply only to the selected <b>{SCEN.find((s) => s.key === scenario).label}</b> scenario.
          The other two scenarios use default assumptions. Cost reduction applies equally to all three.
          EV blended £{evBlended().toFixed(0)} · STB £{PRICE.stb_fhr} · BT £700k through 2027 · FX {getFX()} KRW/£.
        </div>
      </section>
    </>
  );
}

// ============================================================
//  HUMAX EV Charging — Design System
//  Indigo #001C3D · Azure #00B1A1 · Sunshine #FDB515 · Forest #163E35
//  Typeface: Poppins
// ============================================================
const HX = {
  indigo: "#001C3D",
  azure: "#00B1A1",
  sunshine: "#00B1A1",
  forest: "#163E35",
  ink: "#0d1b2a",
  paper: "#f5f7fa",
  card: "#ffffff",
  line: "#dde3ea",
  muted: "#5b6b7d",
};
const ACCENT = HX.indigo;
const POS = HX.azure;   // profit
const NEG = "#d64545";  // loss

const CSS = `
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
  * { box-sizing: border-box; }
  input[type=range]{ -webkit-appearance:none; appearance:none; height:5px; border-radius:5px; background:#d4dce5; outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:${HX.azure}; cursor:pointer; border:3px solid ${HX.indigo}; box-shadow:0 1px 5px rgba(0,28,61,.3); }
  input[type=range]::-moz-range-thumb{ width:18px; height:18px; border-radius:50%; background:${HX.azure}; cursor:pointer; border:3px solid ${HX.indigo}; }
`;

const S = {
  page: { fontFamily: "'Poppins', sans-serif", background: HX.paper, minHeight: "100vh", padding: "28px 32px 60px", color: HX.ink },
  header: { display: "flex", justifyContent: "space-between", alignItems: "flex-end", flexWrap: "wrap", gap: 20, background: HX.indigo, borderRadius: 16, padding: "26px 30px", marginBottom: 22, boxShadow: "0 8px 28px rgba(0,28,61,.18)" },
  kicker: { fontFamily: "'Poppins', sans-serif", fontSize: 11, letterSpacing: 3, color: HX.sunshine, fontWeight: 600, textTransform: "uppercase" },
  h1: { fontFamily: "'Poppins', sans-serif", fontSize: 34, fontWeight: 700, margin: "6px 0 6px", lineHeight: 1.05, color: "#fff", letterSpacing: -0.5 },
  sub: { fontSize: 13, color: "#aebccd", fontWeight: 300 },

// Parse the published "Monthly Tracking" CSV into dashboard data.
// Robust to the sheet's layout: category Target/Actual rows + Grand Total + branch detail.
function parseMonthlyCSV(text) {
  // simple CSV row splitter handling quoted commas
  const rows = text.split(/\r?\n/).map((line) => {
    const out = []; let cur = ""; let q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') q = !q;
      else if (ch === "," && !q) { out.push(cur); cur = ""; }
      else cur += ch;
    }
    out.push(cur);
    return out.map((s) => s.trim());
  });
  const num = (v) => { const n = parseFloat(String(v).replace(/[, ]/g, "")); return isNaN(n) ? 0 : n; };

  // EV blended price & STB price come from CONFIG
  const evP = evBlended();

  // --- category section: rows where col2 in known categories with Target/Actual in col3 ---
  // We aggregate ACTUAL monthly (cols index 3..14 = Jan..Dec) per category label (col1).
  const catActual = {}; // label -> total actual units
  let grandActualMonthly = new Array(12).fill(0);

  rows.forEach((r) => {
    const tag = (r[2] || "").toLowerCase();
    const label = r[1] || "";
    if (tag === "actual" && label && r.length >= 15) {
      const monthly = r.slice(3, 15).map(num);
      const tot = monthly.reduce((a, b) => a + b, 0);
      if (label) catActual[label] = (catActual[label] || 0) + tot;
    }
    if ((r[0] || "").toLowerCase() === "grand total" && tag === "actual") {
      grandActualMonthly = r.slice(3, 15).map(num);
    }
  });

  // --- branch detail section: consolidate channels by wholesaler name (col0) ---
  // Build map from the "Actual Sales detail" block: col0 = Wholesaler, last numeric = total
  const chan = { wholesaler: 0, distributor: 0, dealer: 0, ecommerce: 0, b2b: 0 };
  let curWholesaler = "";
  rows.forEach((r) => {
    const w = (r[0] || "").trim();
    if (w) curWholesaler = w;
    const key = (curWholesaler || "").toLowerCase();
    // total is the last non-empty numeric cell in the row (cols 3..15)
    const monthly = r.slice(3, 15).map(num);
    const tot = monthly.reduce((a, b) => a + b, 0);
    if (tot <= 0) return;
    if (key.includes("yesss") || key.includes("cef")) chan.wholesaler += tot;
    else if (key.includes("stearn") || key.includes("argos")) chan.distributor += tot;
    else if (key.includes("byd")) chan.dealer += tot;
    else if (key.includes("kelvelec")) chan.distributor += tot; // repeat acct → distributor bucket
    else if (key.includes("etc") || key.includes("charged")) chan.b2b += tot;
    else if (key.includes("ecommerce") || key.includes("online")) chan.ecommerce += tot;
  });

  const evMonthlyActual = grandActualMonthly.map((v) => (v > 0 ? v : null));
  const evUnits = grandActualMonthly.reduce((a, b) => a + b, 0);

  return {
    evMonthlyActual,
    evUnits,
    evRev: evUnits * evP,
    categories: [
      { label: "Wholesaler (Yesss, CEF)", actual: chan.wholesaler, target: 4819 },
      { label: "Distributor (Stearn, Argos)", actual: chan.distributor, target: 600 },
      { label: "Dealer Group (BYD Harmony, CG)", actual: chan.dealer, target: 1400 },
      { label: "eCommerce", actual: chan.ecommerce, target: 272 },
      { label: "B2B (ChargedEV)", actual: chan.b2b, target: 3705 },
    ],
  };
}

    setPipe([

      return { ...c, units: u, rev: u * prodPrice(c.product), mx7: c.product === "MX22" ? 0 : u, mx22: c.product === "MX22" ? u : 0 };
    });
    const totUnits = monthlyUnits.reduce((a, b) => a + b, 0);
    const totRev = monthlyRev.reduce((a, b) => a + b, 0);
    const totMx7 = SEG_BASE.reduce((a, s) => a + segTotals[s.key].mx7, 0) + pipeTotals.reduce((a, c) => a + c.mx7, 0);
    const totMx22 = SEG_BASE.reduce((a, s) => a + segTotals[s.key].mx22, 0) + pipeTotals.reduce((a, c) => a + c.mx22, 0);
    return { monthlyUnits, monthlyRev, segTotals, pipeTotals, totUnits, totRev, totMx7, totMx22 };
  }, [rr, pipe]);

  const maxMonthly = Math.max(...calc.monthlyUnits, 1);
  const fmtGBP0 = (n) => "£" + Math.round(n).toLocaleString();
  const baseTotal = SEG_BASE.reduce((a, s) => a + calc.segTotals[s.key].units, 0);
  const pipeTotal = calc.pipeTotals.reduce((a, c) => a + c.units, 0);

  return (
    <div>
      <div style={SG.actionBar}>
        <div style={SG.actionInfo}>
          <span style={SG.actionTitle}>Segment Simulation · 2026</span>
          <span style={SG.actionMsg}>{saveMsg || "Save to keep your inputs when switching tabs or reloading"}</span>

          <div style={D.kpiSub}>Existing {Math.round(baseTotal).toLocaleString()} + Pipeline {Math.round(pipeTotal).toLocaleString()}</div>
        </div>
        <div style={D.kpi}>
          <div style={D.kpiLabel}>2026 Total Revenue</div>
          <div style={{ ...D.kpiVal, color: HX.azure }}>{fmtGBP0(calc.totRev)}</div>
          <div style={D.kpiSub}>{"₩" + Math.round(calc.totRev * getFX()).toLocaleString()}</div>
        </div>
        <div style={D.kpi}>
          <div style={D.kpiLabel}>Pipeline Contribution</div>
          <div style={{ ...D.kpiVal, color: HX.forest }}>{calc.totUnits ? ((pipeTotal / calc.totUnits) * 100).toFixed(0) : 0}%</div>
          <div style={D.kpiSub}>{calc.pipeTotals.length} customers added</div>
        </div>
        <div style={D.kpi}>
          <div style={D.kpiLabel}>Avg Monthly (H2)</div>
          <div style={{ ...D.kpiVal, color: HX.indigo }}>{Math.round(calc.monthlyUnits.slice(6).reduce((a, b) => a + b, 0) / 6).toLocaleString()}</div>
          <div style={D.kpiSub}>units / month (Jul–Dec)</div>
        </div>
      </div>

      <section style={S.panel}>
        <h2 style={S.h2}>2026 Monthly Volume (Existing + Pipeline)</h2>
        <div style={D.chart}>
          {SEG_MONTHS.map((m, i) => (
            <div key={m} style={D.barCol}>
              <div style={D.barStack}>
                <div style={{ ...D.barActual, width: "60%", height: `${(calc.monthlyUnits[i] / maxMonthly) * 100}%`, background: i < 6 ? "#c4d0dc" : HX.azure }}
                  title={`${Math.round(calc.monthlyUnits[i])} units`} />
              </div>
              <div style={D.barLabel}>{m}</div>
              <div style={SG.barNum}>{Math.round(calc.monthlyUnits[i])}</div>
            </div>
          ))}
        </div>
        <div style={D.legend}>
          <span><i style={{ ...D.dot, background: "#c4d0dc" }} /> Jan–Jun (actual run-rate)</span>
          <span><i style={{ ...D.dot, background: HX.azure }} /> Jul–Dec (forecast)</span>
        </div>
      </section>

      <div style={D.grid2}>
        <section style={S.panel}>
          <h2 style={S.h2}>Existing Channels — H2 Run-Rate</h2>
          <div style={S.panelNote}>Jan–Jun uses actual YTD; sliders set Jul–Dec monthly units per channel.</div>
          {SEG_BASE.map((s) => (
            <div key={s.key} style={S.sliderRow}>
              <div style={S.sliderHead}>
                <span style={S.sliderName}><i style={{ ...D.dot, background: s.color }} />{s.label}</span>
                <span style={S.sliderVal}>{Math.round(calc.segTotals[s.key].units).toLocaleString()} units · {fmtGBP0(calc.segTotals[s.key].rev)}</span>
              </div>
              <input type="range" min="0" max="80" value={rr[s.key]}
                onChange={(e) => setRr((p) => ({ ...p, [s.key]: +e.target.value }))} style={S.range} />
              <div style={S.sliderSub}>YTD {s.ytd} · H2 run-rate {rr[s.key]}/mo · {s.product}</div>
            </div>

        </section>

        <section style={S.panel}>
          <div style={SG.pipeHead}>

          </div>
          <div style={S.panelNote}>Add Wholesaler / Distributor / Installer / Dealer / Fleet / Rental·Leasing / MDU / CPO and set monthly units, start month, product.</div>
          {pipe.map((c) => (
            <div key={c.id} style={SG.pipeCard}>
              <div style={SG.pipeRow1}>
                <input value={c.name} onChange={(e) => updPipe(c.id, "name", e.target.value)} style={SG.nameInput} />
                <button onClick={() => delPipe(c.id)} style={SG.delBtn}>✕</button>
              </div>
              <div style={SG.pipeRow2}>
                <select value={c.type} onChange={(e) => updPipe(c.id, "type", e.target.value)} style={SG.sel}>
                  {PIPELINE_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
                </select>
                <select value={c.product} onChange={(e) => updPipe(c.id, "product", e.target.value)} style={SG.selSm}>
                  <option value="MX7">MX7</option>
                  <option value="MX22">MX22</option>
                </select>
              </div>
              <div style={SG.pipeRow3}>
                <label style={SG.miniLabel}>Units/mo
                  <input type="number" min="0" value={c.monthly} onChange={(e) => updPipe(c.id, "monthly", +e.target.value)} style={SG.numInput} />

                <span style={SG.pipeResult}>{(() => { const ct = calc.pipeTotals.find((x) => x.id === c.id); return ct ? `${ct.units.toLocaleString()} units · ${fmtGBP0(ct.rev)}` : ""; })()}</span>
              </div>
            </div>

        </section>
      </div>

      <section style={S.panel}>

            <div key={c.id} style={SG.tr}>
              <span><i style={{ ...D.dot, background: HX.sunshine }} />{c.name} <em style={SG.typeTag}>{c.type}</em></span>
              <span style={SG.tRight}>{c.mx7.toLocaleString()}</span>

              <span style={SG.tRight}>{c.units.toLocaleString()}</span>

              <span style={SG.tRight}>{calc.totUnits ? ((c.units / calc.totUnits) * 100).toFixed(0) : 0}%</span>

          <div style={{ ...SG.tr, ...SG.trTotal }}>
            <span>Total</span>

            <span style={SG.tRight}>{Math.round(calc.totMx22).toLocaleString()}</span>

}

function Settings({ onChange }) {
  const [, force] = useState(0);
  const set = (path, v) => {
    const num = v === "" ? 0 : +v;
    const [grp, key] = path.split(".");
    CONFIG[grp][key] = num;
    force((x) => x + 1);
    onChange && onChange();
  };

  const priceRows = [
    ["MX7 Socket", "price.ev_socket"],
    ["MX7 5M", "price.ev_5m"],
    ["MX7 7.5M", "price.ev_75m"],
    ["MX Pro 22kW (MX22)", "price.ev_22kw"],
    ["STB FHR-6000T", "price.stb_fhr"],
  ];
  const mixRows = [
    ["Socket weight", "mix.socket"],
    ["5M weight", "mix.c5m"],
    ["7.5M weight", "mix.c75m"],
  ];
  const gmRows = [
    ["EV", "gm.ev"],
    ["STB", "gm.stb"],
    ["BT", "gm.bt"],
  ];
  const mixSum = CONFIG.mix.socket + CONFIG.mix.c5m + CONFIG.mix.c75m;

  const Field = ({ label, path, step, suffix, prefix }) => {
    const [grp, key] = path.split(".");
    return (
      <div style={ST.field}>
        <label style={ST.fieldLabel}>{label}</label>
        <div style={ST.inputWrap}>
          {prefix && <span style={ST.affix}>{prefix}</span>}
          <input type="number" step={step || "0.01"} value={CONFIG[grp][key]}
            onChange={(e) => set(path, e.target.value)} style={ST.input} />
          {suffix && <span style={ST.affix}>{suffix}</span>}
        </div>
      </div>
    );
  };

  return (
    <div>
      <div style={ST.banner}>
        These values are the single source of truth. Editing them updates the Dashboard, Segment Simulation, and 3-Year Simulator instantly.
      </div>

      <div style={D.grid2}>
        <section style={S.panel}>
          <h2 style={S.h2}>Model Prices (GBP)</h2>
          <div style={S.panelNote}>Per-unit selling price by model.</div>
          {priceRows.map(([l, p]) => <Field key={p} label={l} path={p} prefix="£" step="0.01" />)}
          <div style={{ ...S.catTotal, marginTop: 16 }}>
            <span style={S.catTotalLabel}>EV Home Blended</span>
            <span style={S.catTotalVal}>£{evBlended().toFixed(2)}/unit</span>
          </div>
        </section>

        <section style={S.panel}>
          <h2 style={S.h2}>Margin Rate & FX</h2>
          <div style={S.panelNote}>Gross margin by line and KRW/GBP exchange rate.</div>
          <div style={S.blockLabel}>Gross Margin (%)</div>
          {gmRows.map(([l, p]) => {
            const [grp, key] = p.split(".");
            return (
              <div key={p} style={ST.field}>
                <label style={ST.fieldLabel}>{l}</label>
                <div style={ST.inputWrap}>
                  <input type="number" step="1" value={+(CONFIG[grp][key] * 100).toFixed(1)}
                    onChange={(e) => { CONFIG[grp][key] = (e.target.value === "" ? 0 : +e.target.value) / 100; force((x) => x + 1); onChange && onChange(); }}
                    style={ST.input} />
                  <span style={ST.affix}>%</span>
                </div>
              </div>
            );
          })}
          <div style={{ ...S.blockLabel, marginTop: 16 }}>Exchange Rate</div>
          <div style={ST.field}>
            <label style={ST.fieldLabel}>KRW per GBP</label>
            <div style={ST.inputWrap}>
              <span style={ST.affix}>₩</span>
              <input type="number" step="0.001" value={CONFIG.fx}
                onChange={(e) => { CONFIG.fx = e.target.value === "" ? 0 : +e.target.value; force((x) => x + 1); onChange && onChange(); }}
                style={ST.input} />
            </div>
          </div>

          <div style={{ ...S.blockLabel, marginTop: 16 }}>EV Home Mix Weights</div>
          <div style={S.panelNote}>How MX7 sales split across variants (used for the blended EV price). Sum: {(mixSum * 100).toFixed(0)}%{Math.abs(mixSum - 1) > 0.001 ? " ⚠ should be 100%" : " ✓"}</div>
          {mixRows.map(([l, p]) => <Field key={p} label={l} path={p} step="0.05" suffix="" />)}
        </section>
      </div>

      <section style={S.panel}>
        <h2 style={S.h2}>Current Effective Values</h2>
        <div style={ST.summaryGrid}>
          <div style={ST.sumCard}><div style={ST.sumLabel}>EV Blended</div><div style={ST.sumVal}>£{evBlended().toFixed(2)}</div></div>
          <div style={ST.sumCard}><div style={ST.sumLabel}>MX22 / Commercial</div><div style={ST.sumVal}>£{PRICE.ev_22kw.toFixed(0)}</div></div>
          <div style={ST.sumCard}><div style={ST.sumLabel}>STB</div><div style={ST.sumVal}>£{PRICE.stb_fhr.toFixed(0)}</div></div>
          <div style={ST.sumCard}><div style={ST.sumLabel}>EV / STB / BT GM</div><div style={ST.sumVal}>{(GM.ev*100).toFixed(0)}/{(GM.stb*100).toFixed(0)}/{(GM.bt*100).toFixed(0)}%</div></div>
          <div style={ST.sumCard}><div style={ST.sumLabel}>FX</div><div style={ST.sumVal}>₩{getFX().toLocaleString()}</div></div>
        </div>
        <div style={S.footNote}>
          Changes apply immediately across all tabs for this session. Reload restores defaults (MX7 Socket £332.14 / 5M £342.37 / 7.5M £357.73 · MX22 £579 · STB £153 · GM 20/20/100% · FX 1810.195).
        </div>
      </section>
    </div>
  );
}
